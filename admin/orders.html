<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171725">
<title>Order Admin — PhoneYa2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f9;color:#171725;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#171725;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:19px}header a{color:#fff;text-decoration:none}.wrap{max-width:1180px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #e4e6ed;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px #11112208}h1{margin:0 0 8px;font-size:28px}h2{margin:0 0 14px;font-size:19px}.muted{color:#697386}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-weight:700}.field input{border:1px solid #d8dce6;border-radius:8px;padding:12px;font:inherit}.btn{border:0;border-radius:8px;padding:11px 15px;background:#ff6000;color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.error{color:#a61b1b;background:#fff0f0;padding:10px;border-radius:8px;margin:10px 0}.success{color:#12663a;background:#e8f8ee;padding:10px;border-radius:8px;margin:10px 0}.hidden{display:none!important}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.order{border:1px solid #e5e7ee;border-radius:12px;margin-top:12px;overflow:hidden}.order-head{padding:15px;background:#fafbfe;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.order-body{padding:15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail strong{display:block;font-size:12px;color:#6b7280}.items{grid-column:1/-1;border-top:1px solid #eceef4;padding-top:10px}.items div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}.item-thumb{width:52px;height:52px;object-fit:contain;border:1px solid #e5e7ee;border-radius:8px;background:#fff;flex:0 0 52px}.item-name-wrap{display:flex;align-items:center;gap:10px;min-width:0}.customer-note{grid-column:1/-1;background:#fff7f0;border:1px solid #ffe0cc;border-radius:9px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}.customer-note strong{display:block;font-size:12px;color:#a94300;margin-bottom:4px}.status{border:1px solid #d7dae5;border-radius:7px;padding:8px;font:inherit;max-width:180px}.order-num{font-weight:900;font-size:16px}.total{font-size:18px;font-weight:900}.empty{padding:24px;text-align:center;color:#697386}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#fff2e9;color:#a94300;font-weight:800;text-transform:capitalize}.loading{color:#697386;padding:20px 0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.stat{border:1px solid #e5e7ee;border-radius:10px;padding:13px;background:#fafbfe}.stat strong{display:block;font-size:22px}.stat span{font-size:12px;color:#697386}.filters{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:10px;margin:16px 0}.filters input,.filters select{width:100%;border:1px solid #d8dce6;border-radius:8px;padding:11px;font:inherit;background:white}.contact-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.contact-actions a{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;background:#e8f8ee;color:#12663a;font-weight:800;font-size:12px}.contact-actions a.call{background:#edf4ff;color:#234c83}@media(max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr}.order-body{grid-template-columns:1fr}.items{grid-column:auto}.panel{padding:16px}.wrap{margin-top:18px}}
</style>
<script src="/ads-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><strong>PhoneYa2 <span style="color:#ff6000">Orders</span></strong><a href="/">← Storefront</a></header>
<main class="wrap">
  <section id="login" class="panel" style="max-width:440px;margin:28px auto">
    <h1>Administrator sign-in</h1><p class="muted">Use your authorized PhoneYa2 Supabase account.</p>
    <div id="login-message" role="status"></div>
    <form id="login-form">
      <div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" id="login-button" type="submit">Sign in</button>
    </form>
  </section>
  <section id="dashboard" class="hidden">
    <div class="panel">
      <div class="toolbar"><div><h1>Orders</h1><p class="muted">Customer information is shown only after administrator authentication.</p></div><div><button class="btn" id="refresh">Refresh orders</button> <button class="btn" id="export-csv" style="background:#45475a">Export CSV</button> <button class="btn" id="test-ntfy" style="background:#286749">Test ntfy</button> <button class="btn" id="logout" style="background:#45475a">Sign out</button></div></div>
      <div class="stats" aria-label="Order overview">
        <div class="stat"><span>Total orders</span><strong id="stat-total">0</strong></div>
        <div class="stat"><span>Pending</span><strong id="stat-pending">0</strong></div>
        <div class="stat"><span>Delivered</span><strong id="stat-delivered">0</strong></div>
        <div class="stat"><span>Order value (excl. cancelled)</span><strong id="stat-sales">ZMW 0.00</strong></div>
      </div>
      <div class="filters"><input id="order-search" type="search" placeholder="Search order number, customer, email, phone or note" aria-label="Search orders"><select id="status-filter" aria-label="Filter orders by status"><option value="all">All statuses</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="processing">Processing</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div>
      <div id="message" role="status"></div><div id="orders"><div class="loading">Loading orders…</div></div>
    </div>
  </section>
</main>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
let client=null, session=null, allOrders=[];
const statuses=["pending","confirmed","processing","shipped","delivered","cancelled"];
function showMessage(target,text,kind){const el=$(target);el.className=text?(kind||""):"";el.textContent=text||"";}
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(n){return "ZMW "+Number(n||0).toLocaleString("en-ZM",{minimumFractionDigits:2,maximumFractionDigits:2});}
async function api(path,options={}){
 const token=session?.access_token;if(!token)throw new Error("Please sign in again.");
 const response=await fetch(path,{...options,headers:{...(options.headers||{}),authorization:"Bearer "+token,"content-type":"application/json"}});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||"Request failed.");
 return data;
}
function updateStats(orders){
 $("stat-total").textContent=orders.length;
 $("stat-pending").textContent=orders.filter(o=>o.status==="pending").length;
 $("stat-delivered").textContent=orders.filter(o=>o.status==="delivered").length;
 const sales=orders.filter(o=>o.status!=="cancelled").reduce((sum,o)=>sum+Number(o.total_amount||0),0);
 $("stat-sales").textContent=money(sales);
}
function renderOrders(orders){allOrders=orders;updateStats(orders);applyFilters();}
function applyFilters(){
 const term=$("order-search").value.trim().toLowerCase(),status=$("status-filter").value;
 const filtered=allOrders.filter(order=>{
  const hay=[order.order_number,order.customer_name,order.customer_email,order.customer_phone,order.delivery_address,order.customer_note].join(" ").toLowerCase();
  return (!term||hay.includes(term))&&(status==="all"||order.status===status);
 });
 renderOrderCards(filtered);
}
function renderOrderCards(orders){
 const host=$("orders");host.replaceChildren();
 if(!orders.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="No orders have been received yet.";host.append(empty);return;}
 orders.forEach(order=>{
  const card=document.createElement("article");card.className="order";
  const head=document.createElement("div");head.className="order-head";
  const left=document.createElement("div");left.innerHTML='<div class="order-num">'+escapeHtml(order.order_number)+'</div><div class="muted">'+escapeHtml(new Date(order.created_at).toLocaleString())+'</div>';
  const right=document.createElement("div");right.style.display="flex";right.style.alignItems="center";right.style.gap="8px";right.style.flexWrap="wrap";
  const pill=document.createElement("span");pill.className="pill";pill.textContent=order.status;
  const select=document.createElement("select");select.className="status";select.setAttribute("aria-label","Update status for "+order.order_number);
  statuses.forEach(status=>{const option=document.createElement("option");option.value=status;option.textContent=status[0].toUpperCase()+status.slice(1);option.selected=status===order.status;select.append(option);});
  select.addEventListener("change",async()=>{select.disabled=true;try{await api("/api/orders?admin=1",{method:"PATCH",body:JSON.stringify({id:order.id,status:select.value})});showMessage("message","Order "+order.order_number+" updated.","success");await loadOrders();}catch(e){showMessage("message",e.message,"error");select.value=order.status;}finally{select.disabled=false;}});
  right.append(pill,select);head.append(left,right);
  const body=document.createElement("div");body.className="order-body";
  const detail=(label,value)=>{const el=document.createElement("div");el.className="detail";const strong=document.createElement("strong");strong.textContent=label;const text=document.createElement("span");text.textContent=value||"—";el.append(strong,text);return el;};
  body.append(detail("Customer",order.customer_name),detail("Phone",order.customer_phone),detail("Email",order.customer_email),detail("Delivery address",order.delivery_address));
  if(order.customer_note){const note=document.createElement("div");note.className="customer-note";const label=document.createElement("strong");label.textContent="Customer note / specifications";const text=document.createElement("div");text.textContent=order.customer_note;note.append(label,text);body.append(note);}
  const phoneDigits=String(order.customer_phone||"").replace(/\D/g,"");
  const contact=document.createElement("div");contact.className="items";
  const contactActions=document.createElement("div");contactActions.className="contact-actions";
  if(phoneDigits){const call=document.createElement("a");call.className="call";call.href="tel:"+String(order.customer_phone).replace(/[^+0-9]/g,"");call.textContent="Call customer";contactActions.append(call);const wa=document.createElement("a");wa.href="https://wa.me/"+phoneDigits;wa.target="_blank";wa.rel="noopener";wa.textContent="WhatsApp customer";contactActions.append(wa);}
  if(contactActions.childElementCount){contact.append(contactActions);body.append(contact);}
  const itemWrap=document.createElement("div");itemWrap.className="items";const title=document.createElement("strong");title.textContent="Items";itemWrap.append(title);
  (order.order_items||[]).forEach(item=>{const row=document.createElement("div");const nameWrap=document.createElement("span");nameWrap.className="item-name-wrap";const image=document.createElement("img");image.className="item-thumb";image.alt=item.product_name||"Product";image.loading="lazy";if(item.product_image){image.src=item.product_image;image.onerror=()=>{image.style.display="none";};}else image.style.display="none";const name=document.createElement("span");name.textContent=(item.product_name||"Product")+" × "+item.quantity;nameWrap.append(image,name);const price=document.createElement("strong");price.textContent=money(item.line_total);row.append(nameWrap,price);itemWrap.append(row);});
  const total=document.createElement("div");total.className="items total";total.textContent="Order total: "+money(order.total_amount);body.append(itemWrap,total);card.append(head,body);host.append(card);
 });
}
async function loadOrders(){ $("orders").innerHTML='<div class="loading">Loading orders…</div>';try{const data=await api("/api/orders?admin=1");renderOrders(data.orders||[]);showMessage("message","","");}catch(e){showMessage("message",e.message,"error");$("orders").replaceChildren();}}
async function showDashboard(){ const data=await api("/api/orders?admin=1"); $("login").classList.add("hidden");$("dashboard").classList.remove("hidden");renderOrders(data.orders||[]);showMessage("message","","");}
function exportCsv(){
 const rows=[["Order number","Created at","Status","Customer","Email","Phone","Delivery address","Customer note","Products","Total","Currency"]];
 allOrders.forEach(o=>rows.push([o.order_number,o.created_at,o.status,o.customer_name,o.customer_email,o.customer_phone,o.delivery_address,o.customer_note||"",(o.order_items||[]).map(i=>i.product_name+" x"+i.quantity).join("; "),o.total_amount,o.currency||"ZMW"]));
 const csv=rows.map(row=>row.map(value=>'"'+String(value??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="phoneya2-orders-"+new Date().toISOString().slice(0,10)+".csv";a.click();URL.revokeObjectURL(url);
}
async function init(){
 const cfg=window.PY2_ADS_CONFIG;
 if(!cfg?.url||!cfg?.key){showMessage("login-message","Supabase configuration could not be loaded.","error");return;}
 if(!window.supabase?.createClient){showMessage("login-message","Sign-in service could not load. Refresh the page.","error");return;}
 client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data}=await client.auth.getSession();session=data.session;
 if(session){try{await api("/api/orders?admin=1");await showDashboard();}catch{await client.auth.signOut();session=null;}}
}
$("login-form").addEventListener("submit",async e=>{e.preventDefault();const button=$("login-button");button.disabled=true;showMessage("login-message","","");try{if(!client)throw new Error("Sign-in service is not ready. Refresh the page.");const {data,error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;session=data.session;await showDashboard();}catch(err){if(client)await client.auth.signOut();session=null;showMessage("login-message",err.message||"Sign-in failed.","error");}finally{button.disabled=false;}});
$("refresh").addEventListener("click",loadOrders);
$("order-search").addEventListener("input",applyFilters);
$("status-filter").addEventListener("change",applyFilters);
$("export-csv").addEventListener("click",exportCsv);
$("test-ntfy").addEventListener("click",async()=>{const button=$("test-ntfy");button.disabled=true;showMessage("message","Sending test notification…","");try{const result=await api("/api/orders?admin=1",{method:"POST",body:JSON.stringify({action:"test-ntfy"})});showMessage("message",result.message||"Test notification sent. Check ntfy on your phone.","success");}catch(e){showMessage("message",e.message,"error");}finally{button.disabled=false;}});
$("logout").addEventListener("click",async()=>{if(client)await client.auth.signOut();session=null;$("dashboard").classList.add("hidden");$("login").classList.remove("hidden");});
init().catch(e=>showMessage("login-message",e.message||"Could not initialize admin sign-in.","error"));
})();
</script>
</body>
</html>
