backend:
  name: github
  repo: BLESSTech-X/BlessTech-X-Accessories
  branch: main
  base_url: https://sveltia-cms-auth.singbless89.workers.dev
  auth_endpoint: /auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: "https://phoneya2.pages.dev"
display_url: "https://phoneya2.pages.dev"
locale: "en"

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    description: "Manage PhoneYa2 product listings, prices, stock, images and featured items."
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — K{{price}} · stock {{stock}}"
    sortable_fields: ["title", "price", "stock", "date_added"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date Added", name: "date_added", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", default: "{{now}}", required: false, hint: "Used to order New Arrivals newest first. Keep the default for new products." }
      - { label: "Selling Price (ZMW)", name: "price", widget: "number", hint: "The actual price customers pay. Keep this updated when prices change." }
      - { label: "Original / Reference Price (ZMW)", name: "original_price", widget: "number", required: false, hint: "Only enter a genuine previous/reference price higher than the selling price. The site calculates savings from these two values; do not use a made-up comparison price." }
      - { label: "Stock", name: "stock", widget: "number", default: 10 }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Phone Cases", value: "case" }
          - { label: "Chargers", value: "charger" }
          - { label: "Cables", value: "cable" }
          - { label: "Earphones & Headsets", value: "earphone" }
          - { label: "Power Banks", value: "powerbank" }
          - { label: "Screen Protectors", value: "protector" }
          - { label: "Phones", value: "phone" }
          - { label: "Watches & Smartwatches", value: "watch" }
          - { label: "Other Phone Accessories", value: "accessory" }
          - { label: "Other / Miscellaneous", value: "other" }
      - { label: "Sales Hook", name: "sales_hook", widget: "string", required: false, hint: "A short customer-focused reason to consider this product. Lead with a practical benefit; only claim features you can confirm." }
      - { label: "Offer Badge", name: "offer_label", widget: "string", required: false, hint: "Optional label shown on product cards, e.g. Featured Pick, Bundle Idea, or Back-to-School Pick. Do not claim a discount unless the Original Price is accurate." }
      - { label: "Offer Details", name: "offer_details", widget: "string", required: false, hint: "Optional short offer terms or bundle details. Keep accurate, include end date/conditions when relevant, and do not invent scarcity." }
      - label: "Sales Priority"
        name: "sales_priority"
        widget: "select"
        required: false
        default: "standard"
        options:
          - { label: "Standard", value: "standard" }
          - { label: "Promote More", value: "promote" }
          - { label: "Seasonal / Campaign", value: "campaign" }
      - { label: "Description", name: "description", widget: "text", hint: "Write 1–2 short, clear sentences about the product and its main benefit. Avoid long paragraphs; include only details you can confirm." }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Gallery", name: "gallery", widget: "list", fields: [{ label: "Image", name: "image", widget: "image" }, { label: "Caption", name: "caption", widget: "string", required: false }], required: false }
      - { label: "Video Link (optional)", name: "video_url", widget: "string", required: false, hint: "Paste a YouTube, TikTok, Instagram Reel/Post, Facebook video, Vimeo, or direct MP4/WebM URL. The site will embed supported links in the page." }
      - { label: "Order Note", name: "order_note", widget: "string", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }


  - name: "blog_posts"
    label: "Blog & Updates"
    label_singular: "Post"
    folder: "content/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Post Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Category", name: "category", widget: "select", options: ["Offers", "Product News", "Buying Guides", "Tips & Tricks", "Phone Care", "Phone & Accessory Basics", "Safety & Security", "PhoneYa2 Updates", "Community"] }
      - { label: "Short Preview", name: "excerpt", widget: "text", hint: "A clear 1–2 sentence preview shown on the blog and other pages." }
      - { label: "Sales Message (optional)", name: "sales_message", widget: "text", required: false, hint: "A useful next step or product-value message for readers. Avoid fake urgency, unsupported claims or invented discounts. Shown in a clear action box on the blog feed." }
      - { label: "Action Button Label", name: "sales_cta_label", widget: "string", required: false, default: "Explore this pick", hint: "Short action text such as Shop this guide, Compare options, or Explore this pick. The button opens the first attached featured product, or the shop if none is attached." }
      - { label: "Cover Image", name: "featured_image", widget: "image", required: false }
      - label: "Additional Images"
        name: "gallery"
        widget: "list"
        required: false
        summary: "{{fields.title}}"
        hint: "Add extra story photos. Each image can have its own optional title and explanatory paragraph. Leave both blank for a clean image-only photo."
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Image Title (optional)", name: "title", widget: "string", required: false }
          - { label: "Image Description (optional)", name: "description", widget: "text", required: false }
          - { label: "Legacy Caption (optional)", name: "caption", widget: "string", required: false, hint: "Kept for older posts; used as the title if no new title is supplied." }
      - { label: "Video Link (optional)", name: "video_url", widget: "string", required: false, hint: "Paste a YouTube, TikTok, Instagram Reel/Post, Facebook video, Vimeo, or direct MP4/WebM URL. YouTube videos also appear in blog preview cards across the site. If this field is blank, a YouTube URL in the article body is detected automatically." }
      - { label: "Author", name: "author", widget: "string", default: "PhoneYa2" }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false }
      - { label: "Publish This Post", name: "publish", widget: "boolean", default: false, hint: "Keep off while drafting. Only published posts appear publicly." }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Featured Products"
        name: "featured_products"
        widget: "list"
        required: false
        summary: "{{fields.product}}"
        hint: "Choose products from the existing PhoneYa2 catalogue. Selected products appear as small images on the blog feed and as product cards with a Buy Now button in the full article. Add an optional caption for each product."
        fields:
          - label: "Product"
            name: "product"
            widget: "relation"
            collection: "products"
            search_fields: ["title", "category"]
            value_field: "{{slug}}"
            display_fields: ["title", "price", "category"]
          - { label: "Product Caption (optional)", name: "caption", widget: "text", required: false, hint: "Explain why this product is relevant to the story. Leave blank if no caption is needed." }
      - { label: "Related Product Slugs (legacy)", name: "related_products", widget: "list", required: false, hint: "Legacy links for older posts. Use Featured Products for full product cards." }
      - { label: "Article Body", name: "body", widget: "markdown" }

  - name: "blog_comments"
    label: "Blog Comments"
    label_singular: "Comment"
    folder: "content/blog-comments"
    branch: "community-comments"
    create: false
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{fields.status}} — {{fields.commenter}} on {{fields.post_slug}}"
    fields:
      - { label: "Commenter", name: "commenter", widget: "string" }
      - { label: "Post Slug", name: "post_slug", widget: "string" }
      - { label: "Comment", name: "message", widget: "text" }
      - { label: "Moderation Status", name: "status", widget: "select", options: ["pending", "approved", "rejected"], default: "pending" }
      - { label: "Submitted At", name: "submitted_at", widget: "datetime" }

  - name: "site_content"
    label: "Website Content"
    description: "Edit existing website wording and contact details. These forms edit existing JSON files; they do not change the page layout or product system."
    format: "json"
    files:
      - label: "Homepage"
        name: "homepage"
        file: "content/settings/homepage.json"
        fields:
          - { label: "Hero line 1", name: "hero_line1", widget: "string", hint: "Keep this short; it appears in the main homepage heading." }
          - { label: "Hero line 2", name: "hero_line2", widget: "string", hint: "Second line of the main homepage heading." }
          - { label: "Hero subtitle", name: "hero_sub", widget: "text" }
          - { label: "Automatically show discounted products as Special Offers", name: "show_discounted_products", widget: "boolean", default: true, required: false, hint: "When enabled, in-stock products with an Original Price higher than Price are added to the homepage hero carousel as Special Offers." }
          - { label: "Maximum automatic Special Offer slides", name: "max_discounted_promotions", widget: "number", min: 0, max: 12, default: 6, required: false, hint: "Choose how many discounted products can be added automatically. Set to 0 to turn off automatic sale slides." }
          - label: "Additional Homepage Hero Promotions"
            name: "hero_promotions"
            widget: "list"
            required: false
            summary: "{{fields.product}} — {{fields.badge}}"
            hint: "Add extra product slides to the main homepage banner. Select a product from the catalogue; optionally customize its badge, heading, description, image and button label. Turn Active off to hide a slide."
            fields:
              - label: "Product"
                name: "product"
                widget: "relation"
                collection: "products"
                search_fields: ["title", "category"]
                value_field: "{{slug}}"
                display_fields: ["title", "price", "category"]
              - { label: "Badge", name: "badge", widget: "string", default: "Featured Pick", required: false }
              - { label: "Heading Override", name: "title", widget: "string", required: false }
              - { label: "Description Override", name: "description", widget: "text", required: false }
              - { label: "Image Override", name: "image", widget: "image", required: false }
              - { label: "Price Label", name: "price_label", widget: "string", required: false, hint: "For example: Only, From, or Special offer." }
              - { label: "Button Label", name: "button_label", widget: "string", default: "View Product", required: false }
              - { label: "Active", name: "active", widget: "boolean", default: true }
          - { label: "Stat 1", name: "stat1", widget: "string" }
          - { label: "Stat 2", name: "stat2", widget: "string" }
          - { label: "Stat 3", name: "stat3", widget: "string" }
          - { label: "Stat 4", name: "stat4", widget: "string" }

      - label: "About Page"
        name: "about"
        file: "content/settings/about.json"
        fields:
          - { label: "Hero line 1", name: "hero_line1", widget: "string" }
          - { label: "Hero line 2", name: "hero_line2", widget: "string" }
          - { label: "Hero subtitle", name: "hero_sub", widget: "text" }
          - { label: "Stat cards", name: "stats", widget: "list", summary: "{{fields.value}} — {{fields.label}}", fields: [{ label: "Value", name: "value", widget: "string" }, { label: "Label", name: "label", widget: "string" }] }
          - { label: "Venture card title", name: "venture_title", widget: "string" }
          - { label: "Venture card text", name: "venture_text", widget: "text" }
          - { label: "Venture website button", name: "venture_button", widget: "string" }
          - { label: "Venture website URL", name: "venture_url", widget: "string" }
          - { label: "Country badge", name: "country_badge", widget: "string" }
          - { label: "Story label", name: "story_label", widget: "string" }
          - { label: "Story heading", name: "story_heading", widget: "string" }
          - { label: "Story paragraphs", name: "story_paragraphs", widget: "list", fields: [{ label: "Paragraph", name: "text", widget: "text" }] }
          - { label: "Values label", name: "values_label", widget: "string" }
          - { label: "Values heading", name: "values_heading", widget: "string" }
          - { label: "Core values", name: "values", widget: "list", summary: "{{fields.title}}", fields: [{ label: "Icon / Emoji", name: "icon", widget: "string" }, { label: "Title", name: "title", widget: "string" }, { label: "Description", name: "description", widget: "text" }] }
          - { label: "Team section label", name: "team_label", widget: "string" }
          - { label: "Team section heading", name: "team_heading", widget: "string" }
          - { label: "Team members / partners", name: "team", widget: "list", summary: "{{fields.name}} — {{fields.role}}", fields: [{ label: "Name", name: "name", widget: "string" }, { label: "Role / Position", name: "role", widget: "string" }, { label: "Biography", name: "bio", widget: "text" }, { label: "Portrait / Photo", name: "image", widget: "image", required: false }, { label: "Fallback Emoji", name: "emoji", widget: "string", required: false }, { label: "WhatsApp URL", name: "whatsapp", widget: "string", required: false }, { label: "Website / Profile URL", name: "website", widget: "string", required: false }, { label: "Facebook URL", name: "facebook", widget: "string", required: false }, { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }, { label: "Display this person", name: "active", widget: "boolean", default: true }] }
          - { label: "Businesses section label", name: "businesses_label", widget: "string" }
          - { label: "Businesses section heading", name: "businesses_heading", widget: "string" }
          - { label: "Businesses section intro", name: "businesses_intro", widget: "text" }
          - { label: "Businesses / Ventures", name: "businesses", widget: "list", summary: "{{fields.name}}", fields: [{ label: "Business / Venture Name", name: "name", widget: "string" }, { label: "Short Tagline", name: "tagline", widget: "string", required: false }, { label: "Description", name: "description", widget: "text" }, { label: "Logo", name: "logo", widget: "image", required: false }, { label: "Website URL", name: "website", widget: "string", required: false }, { label: "Display this business", name: "active", widget: "boolean", default: true }] }
          - { label: "CTA heading", name: "cta_heading", widget: "string" }
          - { label: "CTA text", name: "cta_text", widget: "text" }
          - { label: "CTA business button label", name: "cta_business_label", widget: "string" }
          - { label: "CTA WhatsApp button label", name: "cta_whatsapp_label", widget: "string" }
          - { label: "CTA WhatsApp URL", name: "cta_whatsapp_url", widget: "string" }

      - label: "Contact Details & Page Content"
        name: "contact"
        file: "content/settings/contact.json"
        fields:
          - { label: "WhatsApp number", name: "whatsapp", widget: "string" }
          - { label: "Display phone number", name: "phone", widget: "string" }
          - { label: "Email address", name: "email", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Business hours summary", name: "hours", widget: "string" }
          - { label: "Hero heading", name: "hero_title", widget: "string" }
          - { label: "Hero description", name: "hero_subtitle", widget: "text" }
          - { label: "Contact information heading", name: "info_heading", widget: "string" }
          - { label: "Contact information description", name: "info_subtitle", widget: "text" }
          - { label: "Message form heading", name: "form_heading", widget: "string" }
          - { label: "Message form description", name: "form_subtitle", widget: "text" }
          - { label: "Business hours heading", name: "hours_heading", widget: "string" }
          - label: "Weekly opening hours"
            name: "hours_days"
            widget: "list"
            summary: "{{fields.day}} — {{fields.hours}}"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
              - { label: "Open", name: "open", widget: "boolean", default: true }
          - { label: "FAQ heading", name: "faq_heading", widget: "string" }
          - label: "Frequently asked questions"
            name: "faqs"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

      - label: "Site-wide Wording"
        name: "sitewide"
        file: "content/settings/sitewide.json"
        fields:
          - { label: "Business name", name: "business_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Copyright name", name: "copyright_name", widget: "string" }
          - { label: "Sign-off", name: "signoff", widget: "string", required: false }
          - { label: "Default WhatsApp message", name: "wa_default_msg", widget: "string" }
          - { label: "Shop heading", name: "shop_heading", widget: "string" }
          - { label: "Shop subtitle", name: "shop_sub", widget: "string" }

      - label: "Recent Sales Notifications"
        name: "recent_sales"
        file: "content/settings/recent-sales.json"
        fields:
          - { label: "Internal editing note", name: "_comment", widget: "hidden", default: "Only publish genuine orders. Keep the displayed time accurate and deactivate entries that are no longer current." }
          - label: "Sales notifications"
            name: "sales"
            widget: "list"
            hint: "Only include genuine customer purchases. Keep product, city and time accurate. Turn Active off to hide an entry; do not invent orders or urgency."
            summary: "{{fields.product}} — {{fields.city}} ({{fields.time}})"
            fields:
              - { label: "Product", name: "product", widget: "string" }
              - { label: "City", name: "city", widget: "string" }
              - { label: "Displayed time", name: "time", widget: "string", hint: "Use wording that remains accurate, such as 'yesterday' only when true." }
              - { label: "Active", name: "active", widget: "boolean", default: true }

      - label: "Seasonal Campaigns"
        name: "seasonal_campaigns"
        file: "content/settings/seasonal-campaigns.json"
        format: "json"
        description: "Control PhoneYa2 seasonal themes, Christmas decorations, snowfall, campaign scheduling and promotional popup. Save and publish to make changes live."
        fields:
          - { label: "Campaign enabled", name: "enabled", widget: "boolean", default: false, hint: "Turn on to activate the seasonal experience on the public website." }
          - { label: "Theme", name: "theme", widget: "select", options: [{ label: "Christmas", value: "christmas" }], default: "christmas" }
          - { label: "Decorations on headings", name: "decorations", widget: "boolean", default: true, hint: "Adds restrained festive ornaments beside selected page and section headings. Does not scatter emojis around the site." }
          - { label: "Snowfall", name: "snow", widget: "boolean", default: false, hint: "Only snowflakes fall. Other decorations remain fixed to headings." }
          - { label: "Snowfall intensity", name: "snowIntensity", widget: "number", min: 5, max: 60, step: 5, default: 24, hint: "Controls the number of snowflakes. Keep it subtle for mobile performance." }
          - { label: "Schedule campaign", name: "scheduled", widget: "boolean", default: false }
          - { label: "Campaign start date", name: "start", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: "Campaign end date", name: "end", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
          - { label: "Page coverage", name: "coverage", widget: "select", options: [{ label: "All supported pages", value: "all" }, { label: "Shopping pages", value: "shopping" }, { label: "Content and information pages", value: "content" }], default: "all" }
          - { label: "Promotional popup", name: "popup", widget: "boolean", default: false }
          - { label: "Popup display", name: "popupMode", widget: "select", options: [{ label: "After a short delay", value: "delay" }, { label: "Immediately", value: "immediate" }, { label: "After scrolling", value: "scroll" }], default: "delay" }
          - { label: "Popup delay (seconds)", name: "popupDelay", widget: "number", min: 0, max: 60, default: 5 }
          - { label: "Scroll threshold (%)", name: "popupScroll", widget: "number", min: 5, max: 90, default: 35 }
          - { label: "Popup heading", name: "popupTitle", widget: "string", default: "Make Their Christmas Special" }
          - { label: "Popup message", name: "popupMessage", widget: "text", default: "Discover thoughtful gifts, explore festive offers and shop your favourite phone accessories." }
          - { label: "Popup button label", name: "popupButton", widget: "string", default: "Shop Christmas Deals" }
          - { label: "Popup destination", name: "popupUrl", widget: "string", default: "/shop.html", hint: "Use a PhoneYa2 page path or a trusted HTTPS URL." }
