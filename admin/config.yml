backend:
  name: github
  repo: BLESSTech-X/BlessTech-X-Accessories
  branch: main
  base_url: https://sveltia-cms-auth.singbless89.workers.dev
  auth_endpoint: /auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Automatically optimize new uploads. Individual image fields below override
# the square default with the crop shape best suited to that content.
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 86
  strip_metadata: true
  width: 1200
  height: 1200
  aspect_ratio: "1:1"

site_url: "https://phoneya2.pages.dev"
display_url: "https://phoneya2.pages.dev"
locale: "en"

collections:
  - name: "products"
    label: "Products"
    label_singular: "Product"
    description: "Manage PhoneYa2 product listings, prices, stock, images and featured items."
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — K{{price}} · stock {{stock}}"
    sortable_fields: ["title", "price", "stock", "date_added"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date Added", name: "date_added", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", default: "{{now}}", required: false, hint: "Used to order New Arrivals newest first. Keep the default for new products." }
      - { label: "Selling Price (ZMW)", name: "price", widget: "number", hint: "The actual price customers pay. Keep this updated when prices change." }
      - { label: "Original / Reference Price (ZMW)", name: "original_price", widget: "number", required: false, hint: "Only enter a genuine previous/reference price higher than the selling price. The site calculates savings from these two values; do not use a made-up comparison price." }
      - { label: "Stock", name: "stock", widget: "number", default: 10 }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Phone Cases", value: "case" }
          - { label: "Chargers", value: "charger" }
          - { label: "Cables", value: "cable" }
          - { label: "Earphones & Headsets", value: "earphone" }
          - { label: "Power Banks", value: "powerbank" }
          - { label: "Screen Protectors", value: "protector" }
          - { label: "Phones", value: "phone" }
          - { label: "Watches & Smartwatches", value: "watch" }
          - { label: "Other Phone Accessories", value: "accessory" }
          - { label: "Other / Miscellaneous", value: "other" }
      - { label: "Sales Hook", name: "sales_hook", widget: "string", required: false, hint: "A short customer-focused reason to consider this product. Lead with a practical benefit; only claim features you can confirm." }
      - { label: "Offer Badge", name: "offer_label", widget: "string", required: false, hint: "Optional label shown on product cards, e.g. Featured Pick, Bundle Idea, or Back-to-School Pick. Do not claim a discount unless the Original Price is accurate." }
      - { label: "Offer Details", name: "offer_details", widget: "string", required: false, hint: "Optional short offer terms or bundle details. Keep accurate, include end date/conditions when relevant, and do not invent scarcity." }
      - label: "Sales Priority"
        name: "sales_priority"
        widget: "select"
        required: false
        default: "standard"
        options:
          - { label: "Standard", value: "standard" }
          - { label: "Promote More", value: "promote" }
          - { label: "Seasonal / Campaign", value: "campaign" }
      - { label: "Description", name: "description", widget: "text", hint: "Write 1–2 short, clear sentences about the product and its main benefit. Avoid long paragraphs; include only details you can confirm." }
      - label: "Image"
          - { label: "Businesses section label", name: "businesses_label", widget: "string" }
          - { label: "Businesses section heading", name: "businesses_heading", widget: "string" }
          - { label: "Businesses section intro", name: "businesses_intro", widget: "text" }
          - label: "Businesses / Ventures"
            name: "businesses"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Business / Venture Name", name: "name", widget: "string" }
              - { label: "Short Tagline", name: "tagline", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Logo"
          - { label: "CTA heading", name: "cta_heading", widget: "string" }
          - { label: "CTA text", name: "cta_text", widget: "text" }
          - { label: "CTA business button label", name: "cta_business_label", widget: "string" }
          - { label: "CTA WhatsApp button label", name: "cta_whatsapp_label", widget: "string" }
          - { label: "CTA WhatsApp URL", name: "cta_whatsapp_url", widget: "string" }

      - label: "Contact Details & Page Content"
        name: "contact"
        file: "content/settings/contact.json"
        fields:
          - { label: "WhatsApp number", name: "whatsapp", widget: "string" }
          - { label: "Display phone number", name: "phone", widget: "string" }
          - { label: "Email address", name: "email", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }
          - { label: "Business hours summary", name: "hours", widget: "string" }
          - { label: "Hero heading", name: "hero_title", widget: "string" }
          - { label: "Hero description", name: "hero_subtitle", widget: "text" }
          - { label: "Contact information heading", name: "info_heading", widget: "string" }
          - { label: "Contact information description", name: "info_subtitle", widget: "text" }
          - { label: "Message form heading", name: "form_heading", widget: "string" }
          - { label: "Message form description", name: "form_subtitle", widget: "text" }
          - { label: "Business hours heading", name: "hours_heading", widget: "string" }
          - label: "Weekly opening hours"
            name: "hours_days"
            widget: "list"
            summary: "{{fields.day}} — {{fields.hours}}"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
              - { label: "Open", name: "open", widget: "boolean", default: true }
          - { label: "FAQ heading", name: "faq_heading", widget: "string" }
          - label: "Frequently asked questions"
            name: "faqs"
            widget: "list"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

      - label: "Site-wide Wording"
        name: "sitewide"
        file: "content/settings/sitewide.json"
        fields:
          - { label: "Business name", name: "business_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Copyright name", name: "copyright_name", widget: "string" }
          - { label: "Sign-off", name: "signoff", widget: "string", required: false }
          - { label: "Default WhatsApp message", name: "wa_default_msg", widget: "string" }
          - { label: "Shop heading", name: "shop_heading", widget: "string" }
          - { label: "Shop subtitle", name: "shop_sub", widget: "string" }

      - label: "Recent Sales Notifications"
        name: "recent_sales"
        file: "content/settings/recent-sales.json"
        fields:
          - { label: "Internal editing note", name: "_comment", widget: "hidden", default: "Only publish genuine orders. Keep the displayed time accurate and deactivate entries that are no longer current." }
          - label: "Sales notifications"
            name: "sales"
            widget: "list"
            hint: "Only include genuine customer purchases. Keep product, city and time accurate. Turn Active off to hide an entry; do not invent orders or urgency."
            summary: "{{fields.product}} — {{fields.city}} ({{fields.time}})"
            fields:
              - { label: "Product", name: "product", widget: "string" }
              - { label: "City", name: "city", widget: "string" }
              - { label: "Displayed time", name: "time", widget: "string", hint: "Use wording that remains accurate, such as 'yesterday' only when true." }
              - { label: "Active", name: "active", widget: "boolean", default: true }
