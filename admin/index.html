<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhoneYa2 Admin — Product Manager</title>
<style>
  body { margin:0; font-family:sans-serif; background:#0f172a; }
  #loading-screen {
    position:fixed; inset:0; background:#0f172a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; z-index:9999;
  }
  #loading-screen img { height:60px; border-radius:12px; margin-bottom:20px; }
  #loading-screen h2 { font-size:1.4rem; margin:0 0 8px; }
  #loading-screen p  { color:rgba(255,255,255,.5); font-size:14px; margin:0; }
  .spinner {
    width:32px; height:32px; border:3px solid rgba(255,255,255,.15);
    border-top-color:#ff6000; border-radius:50%;
    animation:spin .7s linear infinite; margin-bottom:20px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- Loading screen while CMS boots -->
<div id="loading-screen">
  <img src="https://i.ibb.co/s9CG52wV/file-0000000059948211a0bdd52c4d236852-1.jpg"
       alt="PhoneYa2-ZM"
       onerror="this.style.display='none'">
  <div class="spinner"></div>
  <h2>PhoneYa2 Admin</h2>
  <p>Loading product manager…</p>
</div>

<!-- Decap CMS — loaded from CDN, no install needed -->
<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"
        onload="initCMS()"
        onerror="showError()"></script>

<script>
function showError() {
  document.getElementById('loading-screen').innerHTML = `
    <img src="https://i.ibb.co/s9CG52wV/file-0000000059948211a0bdd52c4d236852-1.jpg" alt="" style="height:50px;border-radius:10px;margin-bottom:16px;">
    <h2 style="color:white;margin:0 0 8px">Could not load CMS</h2>
    <p style="color:rgba(255,255,255,.5);font-size:14px;text-align:center;max-width:360px;line-height:1.6">
      Please check your internet connection and refresh the page.<br><br>
      If the problem persists, visit your GitHub repository directly to edit product files.
    </p>
    <button onclick="location.reload()" style="margin-top:20px;background:#ff6000;color:white;border:none;padding:12px 24px;border-radius:8px;font-size:14px;cursor:pointer;">Retry</button>`;
}

function initCMS() {
  // Hide loading screen once CMS loads
  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    if (ls) ls.style.display = 'none';
  }, 800);

  CMS.init({
    config: {
      // ─── BACKEND ────────────────────────────────────────────────────────────
      // Uses GitHub API directly — no Netlify needed.
      // Customers log in with their GitHub account.
      backend: {
        name: 'github',
        repo: 'BLESSTech-X/BlessTech-X-Accessories', // ← CHANGE THIS (see instructions below)
        branch: 'main',
        base_url: 'https://sveltia-cms-auth.pages.dev' // Free OAuth proxy — works with Vercel
      },

      // ─── MEDIA ──────────────────────────────────────────────────────────────
      // Product images are stored in this folder in your GitHub repo
      media_folder:  'assets/images/uploads',
      public_folder: '/assets/images/uploads',

      // ─── COLLECTIONS ────────────────────────────────────────────────────────
      collections: [

        // ══════════════════════════════════════════════════════════
        //  PRODUCTS — add, edit, delete products
        // ══════════════════════════════════════════════════════════
        {
          name:           'products',
          label:          '📦 Products',
          label_singular: 'Product',
          folder:         'content/products',
          create:         true,
          delete:         true,
          slug:           '{{slug}}',
          preview_path:   'product.html?id={{slug}}',
          summary:        '{{fields.title}} — ZMW {{fields.price}} | {{fields.category}} | Stock: {{fields.stock}} {{#if fields.featured}}⭐{{/if}}',
          sortable_fields: ['title', 'price', 'category', 'stock'],
          view_filters: [
            { label: 'Featured',     field: 'featured',  pattern: true  },
            { label: 'Out of Stock', field: 'stock',     pattern: 0     },
            { label: 'Cases',        field: 'category',  pattern: 'case' },
            { label: 'Chargers',     field: 'category',  pattern: 'charger' },
            { label: 'Phones',       field: 'category',  pattern: 'phone' },
          ],
          fields: [
            {
              label:  'Product Name',
              name:   'title',
              widget: 'string',
              hint:   'Full product name shown on your website and in order forms'
            },
            {
              label:      'Sale Price (ZMW)',
              name:       'price',
              widget:     'number',
              value_type: 'int',
              min:        0,
              hint:       'Current selling price in Zambian Kwacha'
            },
            {
              label:      'Original Price (ZMW)',
              name:       'original_price',
              widget:     'number',
              value_type: 'int',
              min:        0,
              default:    0,
              hint:       'Set this HIGHER than the sale price to show a discount badge (e.g. price=130, original_price=160 shows "Save ZMW 30"). Leave 0 for no discount.'
            },
            {
              label:      'Stock Quantity',
              name:       'stock',
              widget:     'number',
              value_type: 'int',
              min:        0,
              default:    10,
              hint:       '0 = Out of Stock (red badge) | 1–5 = Low Stock warning (orange) | 6+ = In Stock (green). Update this after every sale.'
            },
            {
              label:   'Category',
              name:    'category',
              widget:  'select',
              options: [
                { label: '📱 Phone Cases',        value: 'case'       },
                { label: '⚡ Chargers',            value: 'charger'    },
                { label: '🔌 Cables',              value: 'cable'      },
                { label: '🎧 Earphones',           value: 'earphone'   },
                { label: '🔋 Power Banks',         value: 'powerbank'  },
                { label: '🛡️ Screen Protectors',  value: 'protector'  },
                { label: '📲 Phones',              value: 'phone'      },
                { label: '✨ Other Accessories',   value: 'other'      }
              ]
            },
            {
              label:    'Main Product Image',
              name:     'image',
              widget:   'image',
              required: false,
              hint:     'Primary photo shown on the shop page. Minimum 800×800px recommended. Square photos look best.'
            },
            {
              label:    'Product Gallery (Extra Photos)',
              name:     'gallery',
              widget:   'list',
              required: false,
              hint:     'Upload additional photos — different angles, colours, in-use shots. These appear as clickable thumbnails on the product detail page.',
              fields: [
                {
                  label: 'Photo',
                  name:  'image',
                  widget:'image',
                  hint:  'Upload a product photo'
                },
                {
                  label:    'Caption (optional)',
                  name:     'caption',
                  widget:   'string',
                  required: false,
                  hint:     'e.g. "Back view" or "Available in Black and White"'
                }
              ]
            },
            {
              label:  'Description',
              name:   'description',
              widget: 'text',
              hint:   '2–4 sentences describing what the product does and why it is worth buying. This appears on the shop card, product page, and WhatsApp share messages.'
            },
            {
              label:    'WhatsApp Order Note (optional)',
              name:     'order_note',
              widget:   'string',
              required: false,
              hint:     'Extra information added to the order form when a customer clicks "Order Now". e.g. "Available in Black, White, and Blue — tell us your colour when ordering."'
            },
            {
              label:   '⭐ Feature on Homepage?',
              name:    'featured',
              widget:  'boolean',
              default: false,
              hint:    'Turn ON to show this product in the Featured / New Arrivals sections on the homepage. Keep to 6–8 products max.'
            }
          ]
        },

        // ══════════════════════════════════════════════════════════
        //  SITE SETTINGS
        // ══════════════════════════════════════════════════════════
        {
          name:  'settings',
          label: '⚙️ Site Settings',
          files: [

            // Homepage settings
            {
              label: '🏠 Homepage Content',
              name:  'homepage',
              file:  'content/settings/homepage.json',
              fields: [
                { label: 'Hero Headline — Line 1 (white text)',    name: 'hero_line1',      widget: 'string', default: "Lusaka's Best" },
                { label: 'Hero Headline — Line 2 (orange/rainbow)',name: 'hero_line2',      widget: 'string', default: 'Phone Accessories' },
                { label: 'Hero Subtitle',                           name: 'hero_sub',        widget: 'text',   default: 'Premium cases, chargers, cables & more. Genuine products, same-day delivery across Lusaka.' },
                { label: 'Stat 1 (e.g. 500+)',                     name: 'stat1',           widget: 'string', default: '500+' },
                { label: 'Stat 2 (e.g. 1,200+)',                   name: 'stat2',           widget: 'string', default: '1,200+' },
                { label: 'Stat 3 (e.g. Same Day)',                 name: 'stat3',           widget: 'string', default: 'Same Day' },
                { label: 'Stat 4 (e.g. 4.9★)',                    name: 'stat4',           widget: 'string', default: '4.9★' },
                { label: 'Promo Banner Heading',                   name: 'promo_heading',   widget: 'string', required: false, default: "Ready to Order? It's Easy on WhatsApp 💬" },
                { label: 'Promo Banner Subtext',                   name: 'promo_sub',       widget: 'text',   required: false, default: "Browse the shop, pick what you need, and send us a message. We'll confirm your order and deliver to your door." }
              ]
            },

            // Contact settings
            {
              label: '📞 Contact Information',
              name:  'contact',
              file:  'content/settings/contact.json',
              fields: [
                { label: 'WhatsApp Number (digits only, no + or spaces)', name: 'whatsapp',  widget: 'string', default: '260979603741', hint: 'Used in wa.me links. Example: 260979603741' },
                { label: 'Phone (display format)',                          name: 'phone',     widget: 'string', default: '+260 979 603 741' },
                { label: 'Email Address',                                   name: 'email',     widget: 'string', default: 'singbless89@gmail.com' },
                { label: 'Location / Address',                              name: 'location',  widget: 'string', default: 'Lusaka, Zambia' },
                { label: 'Business Hours',                                  name: 'hours',     widget: 'string', default: 'Mon–Sat, 8am – 7pm' },
                { label: 'Facebook Page URL',                               name: 'facebook',  widget: 'string', required: false, hint: 'Full URL e.g. https://facebook.com/phoneya2zm' },
                { label: 'Instagram Profile URL',                           name: 'instagram', widget: 'string', required: false },
                { label: 'TikTok Profile URL',                              name: 'tiktok',    widget: 'string', required: false }
              ]
            },

            // Recent sales (social proof popups)
            {
              label: '🔔 Recent Sales Notifications',
              name:  'recent_sales',
              file:  'content/settings/recent-sales.json',
              hint:  'These appear as small "Someone just ordered..." popups. Only add real completed orders.',
              fields: [
                {
                  label: 'Sales List',
                  name:  'sales',
                  widget:'list',
                  hint:  'Each entry is a real order. Only "Active" entries can appear. Maximum 15 recommended.',
                  fields: [
                    { label: 'Product Ordered',      name: 'product', widget: 'string', hint: 'e.g. Clear Slim Case' },
                    { label: 'Customer City',         name: 'city',    widget: 'string', default: 'Lusaka' },
                    { label: 'Time (e.g. 2 hours ago)', name: 'time', widget: 'string', default: '2 hours ago', hint: 'Update regularly to keep it fresh.' },
                    { label: 'Show this notification?', name: 'active', widget: 'boolean', default: true }
                  ]
                }
              ]
            }

          ]
        }

      ]
    }
  });
}
</script>

</body>
</html>
