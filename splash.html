<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneYa2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d0d0d;
            font-family: 'Segoe UI', sans-serif;
        }
        .splash {
            text-align: center;
        }
        .splash img {
            width: 200px;
            height: auto;
            animation: fadeIn 1s ease-in;
        }
        .splash h1 {
            color: #25D366;
            font-size: 28px;
            margin-top: 20px;
            letter-spacing: 2px;
        }
        .splash p {
            color: #888;
            font-size: 14px;
            letter-spacing: 1px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
    <!-- Auto-redirect to main page after 2 seconds -->
    <meta http-equiv="refresh" content="2;url=https://phoneya2-accessories.vercel.app/">
</head>
<body>
    <div class="splash">
        <img src="/icon-512x512.png" alt="PhoneYa2">
        <h1>PhoneYa2</h1>
        <p>Smarter Choices. Better Connected.</p>
    </div>
</body>
</html>
