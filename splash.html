<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PhoneYa2-ZM</title>
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, 'DM Sans', sans-serif;
      background: #0d0d0d;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ─── BACKGROUND ORBS ───────────────────────────────────── */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.4;
    }
    .orb-1 {
      width: 300px;
      height: 300px;
      background: #ff6000;
      top: -80px;
      right: -100px;
      animation: orbFloat1 6s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 200px;
      height: 200px;
      background: #25d366;
      bottom: -60px;
      left: -80px;
      animation: orbFloat2 8s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 180px;
      height: 180px;
      background: #54a0ff;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: orbFloat3 10s ease-in-out infinite alternate;
    }
    
    @keyframes orbFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-40px, 30px) scale(1.2); }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, -40px) scale(1.3); }
    }
    @keyframes orbFloat3 {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0.5; }
    }
    
    /* ─── SPLASH CONTAINER ────────────────────────────────────── */
    .splash {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      animation: fadeIn 0.8s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    /* ─── LOGO ────────────────────────────────────────────────── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .logo-img {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 12px 40px rgba(255, 96, 0, 0.25);
      animation: logoPulse 2.5s ease-in-out infinite;
    }
    
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(255, 96, 0, 0.25); }
      50% { transform: scale(1.04); box-shadow: 0 16px 56px rgba(255, 96, 0, 0.4); }
    }
    
    .logo-text {
      font-family: 'Syne', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: white;
      margin-top: 16px;
      letter-spacing: 1px;
    }
    
    .logo-text span {
      background: linear-gradient(135deg, #ff6000, #ff9f43);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .logo-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 4px;
      font-weight: 500;
    }
    
    /* ─── LOADING BAR ──────────────────────────────────────────── */
    .loading-wrap {
      width: 100%;
      max-width: 280px;
      margin: 0 auto 20px;
    }
    
    .loading-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    
    .loading-bar {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: linear-gradient(90deg, #ff6000, #ff9f43, #25d366, #54a0ff);
      background-size: 300% 100%;
      animation: barProgress 2.8s ease-in-out forwards, barShimmer 1.5s ease infinite;
      transition: width 0.3s ease;
    }
    
    @keyframes barProgress {
      0% { width: 0%; }
      20% { width: 18%; }
      40% { width: 38%; }
      60% { width: 62%; }
      80% { width: 82%; }
      95% { width: 96%; }
      100% { width: 100%; }
    }
    
    @keyframes barShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }
    
    /* ─── STATUS TEXT ──────────────────────────────────────────── */
    .status-wrap {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .status-text {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.3px;
      font-weight: 400;
      transition: opacity 0.4s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-text .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #25d366;
      animation: dotPulse 1.2s ease-in-out infinite;
    }
    
    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.6); }
    }
    
    .status-text .emoji {
      font-size: 18px;
    }
    
    /* ─── FOOTER ────────────────────────────────────────────────── */
    .splash-footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.5px;
    }
    
    .splash-footer a {
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.3s;
    }
    
    .splash-footer a:hover {
      color: rgba(255,255,255,0.6);
    }
    
    /* ─── FADE OUT ON EXIT ──────────────────────────────────────── */
    .splash-exit {
      animation: fadeOut 0.6s ease forwards;
    }
    
    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.05); }
    }
    
    /* ─── RESPONSIVE ───────────────────────────────────────────── */
    @media (max-width: 480px) {
      .logo-img {
        width: 90px;
        height: 90px;
      }
      .logo-text {
        font-size: 22px;
      }
      .loading-wrap {
        max-width: 220px;
      }
      .status-text {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND ORBS -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- SPLASH CONTENT -->
  <div class="splash" id="splash">

    <!-- LOGO -->
    <div class="logo-wrap">
      <img 
        src="/icon-512x512.png" 
        alt="PhoneYa2-ZM" 
        class="logo-img"
        onerror="this.src='https://i.ibb.co/s9CG52wV/file-0000000059948211a0bdd52c4d236852-1.jpg'"
        loading="eager"
      >
      <div class="logo-text">Phone<span>Ya</span><span style="background:linear-gradient(135deg,#25d366,#54a0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">2</span></div>
      <div class="logo-sub">Smarter Choices. Better Connected.</div>
    </div>

    <!-- LOADING BAR -->
    <div class="loading-wrap">
      <div class="loading-track">
        <div class="loading-bar" id="loadingBar"></div>
      </div>
    </div>

    <!-- STATUS TEXT -->
    <div class="status-wrap">
      <div class="status-text" id="statusText">
        <span class="emoji">📱</span>
        <span id="statusMessage">Getting things ready...</span>
        <span class="dot"></span>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="splash-footer">
      <a href="https://wa.me/260979603741" target="_blank">📲 WhatsApp: +260 979 603 741</a>
    </div>
  </div>

  <script>
    // ─── STATUS MESSAGES ────────────────────────────────────────────────────
    const messages = [
      { emoji: '📱', text: 'Loading products...' },
      { emoji: '⚡', text: 'Checking stock...' },
      { emoji: '📦', text: 'Preparing your shop...' },
      { emoji: '🚀', text: 'Almost ready...' },
    ];

    let msgIndex = 0;
    const statusEl = document.getElementById('statusMessage');
    const statusWrap = document.querySelector('.status-text');

    function updateStatus() {
      const msg = messages[msgIndex % messages.length];
      // Fade out, change text, fade in
      statusWrap.style.opacity = '0';
      setTimeout(() => {
        statusEl.textContent = msg.text;
        statusWrap.querySelector('.emoji').textContent = msg.emoji;
        statusWrap.style.opacity = '1';
      }, 300);
      msgIndex++;
    }

    // ─── START STATUS ROTATION ─────────────────────────────────────────────
    // First update after 0.6s, then every 0.8s
    setTimeout(updateStatus, 600);
    setInterval(updateStatus, 800);

    // ─── REDIRECT TO MAIN PAGE ────────────────────────────────────────────
    // Wait for loading bar to finish (3s), then redirect
    const splash = document.getElementById('splash');

    setTimeout(() => {
      // Fade out splash
      splash.classList.add('splash-exit');
      
      // Redirect after fade out
      setTimeout(() => {
        window.location.href = '/index.html';
      }, 600);
    }, 3000);

    // ─── FALLBACK: If user taps during loading, redirect immediately ──────
    splash.addEventListener('click', () => {
      window.location.href = '/index.html';
    });

    // ─── ALTERNATIVE: Prevent white flash ──────────────────────────────────
    // Force dark background even before CSS loads
    document.documentElement.style.backgroundColor = '#0d0d0d';

    console.log('[Splash] PhoneYa2-ZM loading...');
  </script>

</body>
</html>
