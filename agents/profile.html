<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Profile — PhoneYa2</title>
<meta name="description" content="View a PhoneYa2-ZM verified sales agent's profile.">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.profile-wrap { max-width: 560px; margin: 40px auto; padding: 0 20px 80px; }

/* Hero card */
.profile-hero {
  background: linear-gradient(135deg,#0a0a1a,#1c1c3a);
  border-radius: var(--r2);
  padding: 32px 24px 28px;
  text-align: center;
  color: white;
  position: relative;
  overflow: hidden;
  margin-bottom: 20px;
}
.profile-hero::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(255,96,0,.25), transparent 70%);
  border-radius: 50%;
}
.profile-hero-inner { position: relative; z-index: 1; }

.profile-photo {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid rgba(255,255,255,.15);
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
  margin: 0 auto 16px;
  background: #eee;
  display: block;
}
.profile-photo-fallback {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff6000,#ff9f43);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne',sans-serif;
  font-weight: 800;
  font-size: 48px;
  color: white;
  margin: 0 auto 16px;
  border: 4px solid rgba(255,255,255,.15);
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
}

.profile-verified-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(37,211,102,.15);
  color: #4ade80;
  border: 1px solid rgba(37,211,102,.35);
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 14px;
}
.profile-name {
  font-family: 'Syne',sans-serif;
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 6px;
  line-height: 1.2;
  word-break: break-word;
}
.profile-id-line {
  font-size: 13px;
  color: rgba(255,255,255,.55);
  font-family: ui-monospace, Menlo, monospace;
  word-break: break-all;
}

/* Level badge */
.profile-level {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg,#7c3aed,#a855f7);
  color: white;
  font-size: 11px;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 100px;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-top: 14px;
}

/* Stat row */
.profile-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.profile-stat {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 12px;
  text-align: center;
}
.profile-stat-val {
  font-family: 'DM Sans',sans-serif;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 4px;
  word-break: break-word;
}
.profile-stat-lbl {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}

/* Info card */
.profile-info-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 20px 22px;
  margin-bottom: 20px;
}
.profile-info-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.profile-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.profile-row:last-child { border-bottom: none; }
.profile-lbl { color: var(--muted); font-weight: 600; flex-shrink: 0; }
.profile-val { color: var(--text); font-weight: 700; text-align: right; word-break: break-word; }

/* QR card */
.qr-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 24px;
  text-align: center;
  margin-bottom: 20px;
}
.qr-card h3 {
  font-size: 1rem;
  margin-bottom: 4px;
}
.qr-card p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 16px;
}
.qr-card #qrBox {
  display: inline-flex;
  padding: 16px;
  background: white;
  border-radius: var(--r);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

/* CTA buttons */
.profile-cta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.profile-cta .btn { flex: 1; min-width: 160px; justify-content: center; }

/* Loading / not found */
.profile-state {
  text-align: center;
  padding: 60px 24px;
}
.profile-state-icon {
  font-size: 3rem;
  margin-bottom: 12px;
}
.profile-state h3 {
  font-size: 1.1rem;
  margin-bottom: 8px;
}
.profile-state p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
  max-width: 400px;
  margin: 0 auto 20px;
}

html, body { overflow-x: hidden; }
@media(max-width:480px) {
  .profile-wrap { margin: 20px auto; padding: 0 14px 60px; }
  .profile-photo,
  .profile-photo-fallback { width: 100px; height: 100px; font-size: 40px; }
  .profile-name { font-size: 1.25rem; }
  .profile-stats { gap: 8px; }
  .profile-stat { padding: 14px 8px; }
  .profile-stat-val { font-size: 1.15rem; }
}
</style>
</head>
<body>

<div id="nav-wrap"></div>

<div class="profile-wrap">

  <div id="loadingState" class="profile-state">
    <div class="spinner dark" style="margin: 0 auto 16px; width: 32px; height: 32px;"></div>
    <p style="color:var(--muted);font-size:14px;">Loading agent profile…</p>
  </div>

  <div id="profileContent" style="display:none;"></div>

  <div id="notFoundState" class="profile-state" style="display:none;">
    <div class="profile-state-icon">🔍</div>
    <h3>Agent Not Found</h3>
    <p>We could not find a verified PhoneYa2-ZM agent matching this ID. The agent may be inactive, or the link may be incorrect.</p>
    <div class="profile-cta">
      <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
      <a href="verify.html" class="btn btn-outline"><i class="fas fa-shield-halved"></i> Verify Another</a>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="config.js"></script>
<script>
document.getElementById('nav-wrap').innerHTML = buildNav('public');

// ── LOAD PROFILE ─────────────────────────────────────────────────────────
async function loadProfile(identifier) {
  if (!identifier) return showNotFound();

  try {
    // Try by agent_id first, then agent_code
    let agent = await db.getOne('agents', `agent_id=eq.${encodeURIComponent(identifier)}&active=eq.true`);
    if (!agent) {
      agent = await db.getOne('agents', `agent_code=eq.${encodeURIComponent(identifier)}&active=eq.true`);
    }
    if (!agent) return showNotFound();

    await loadLevels();

    // Fetch confirmed + paid sales for this agent
    const sales = await db.getAll('sales', {
      filter: `agent_code=eq.${agent.agent_code}`,
    });
    const confirmed = sales.filter(s => s.status === 'confirmed' || s.status === 'paid');
    const totalSales = confirmed.length;
    const totalRevenue = confirmed.reduce((t,s) => t + (s.amount || 0), 0);
    const customerSet = new Set(confirmed.map(s => s.customer_phone).filter(Boolean));
    const customers = customerSet.size;
    const level = calcAgentLevel(totalSales, totalRevenue);

    // Build the profile HTML
    const photoHtml = agent.profile_photo_url
      ? `<img src="${esc(agent.profile_photo_url)}" alt="${esc(agent.full_name)}" class="profile-photo"
              onerror="this.style.display='none';this.nextElementSibling && (this.nextElementSibling.style.display='flex');">
         <div class="profile-photo-fallback" style="display:none;">${(agent.full_name || '?')[0].toUpperCase()}</div>`
      : `<div class="profile-photo-fallback">${(agent.full_name || '?')[0].toUpperCase()}</div>`;

    document.getElementById('profileContent').innerHTML = `
      <!-- HERO -->
      <div class="profile-hero">
        <div class="profile-hero-inner">
          ${photoHtml}
          <div class="profile-verified-badge">
            <i class="fas fa-circle-check"></i> Verified Agent
          </div>
          <div class="profile-name">${esc(agent.full_name)}</div>
          <div class="profile-id-line">${esc(agent.agent_id)} · ${esc(agent.agent_code)}</div>
          ${level.current ? `<div class="profile-level"><i class="fas fa-award"></i> ${esc(level.current.name)}</div>` : ''}
        </div>
      </div>

      <!-- STATS -->
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-val" style="color:var(--orange);">${totalSales}</div>
          <div class="profile-stat-lbl">Sales</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-val" style="color:#16a34a;">${fmtMoney(totalRevenue)}</div>
          <div class="profile-stat-lbl">Revenue</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-val">${customers}</div>
          <div class="profile-stat-lbl">Customers</div>
        </div>
      </div>

      <!-- INFO -->
      <div class="profile-info-card">
        <div class="profile-info-title"><i class="fas fa-id-card"></i> Agent Details</div>
        <div class="profile-row">
          <span class="profile-lbl">Full Name</span>
          <span class="profile-val">${esc(agent.full_name)}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Agent ID</span>
          <span class="profile-val" style="font-family:monospace;color:var(--orange);">${esc(agent.agent_id)}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Agent Code</span>
          <span class="profile-val" style="font-family:monospace;color:var(--orange);">${esc(agent.agent_code)}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Location</span>
          <span class="profile-val">${esc(agent.location || '—')}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Joined</span>
          <span class="profile-val">${fmtDate(agent.joined_at)}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Status</span>
          <span class="profile-val"><span class="pill-approved">Active</span></span>
        </div>
      </div>

      <!-- QR -->
      <div class="qr-card">
        <h3>Scan to Verify</h3>
        <p>Customers can scan this QR code to confirm this agent is legitimate.</p>
        <div id="qrBox"></div>
        <div class="profile-cta">
          <a href="verify.html?id=${esc(agent.agent_id)}" class="btn btn-outline btn-sm">
            <i class="fas fa-shield-halved"></i> Open Verification
          </a>
          <button class="btn btn-outline btn-sm" onclick="copyVerifyLink('${esc(agent.agent_id)}')">
            <i class="fas fa-copy"></i> Copy Link
          </button>
        </div>
      </div>

      <!-- CONTACT CTA -->
      <div class="profile-cta">
        <a href="${waLink('Hi! I would like to order PhoneYa2-ZM products from ' + agent.full_name + ' (' + agent.agent_code + ').')}" target="_blank" class="btn btn-green">
          <i class="fab fa-whatsapp"></i> Order via WhatsApp
        </a>
        <a href="index.html" class="btn btn-outline">
          <i class="fas fa-home"></i> PhoneYa2 Home
        </a>
      </div>
    `;

    // Render QR code
    const verifyUrl = `${CONFIG.agentSiteUrl}/verify.html?id=${agent.agent_id}`;
    new QRCode(document.getElementById('qrBox'), {
      text: verifyUrl,
      width: 160,
      height: 160,
      correctLevel: QRCode.CorrectLevel.H,
    });

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('profileContent').style.display = 'block';
  } catch (e) {
    console.error(e);
    toast('⚠️  ' + e.message);
    showNotFound();
  }
}

function showNotFound() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('profileContent').style.display = 'none';
  document.getElementById('notFoundState').style.display = 'block';
}

function copyVerifyLink(agentId) {
  copyToClipboard(`${CONFIG.agentSiteUrl}/verify.html?id=${agentId}`);
  toast('✅ Verification link copied');
}

// ── URL PARSING ──────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const id     = params.get('id') || params.get('code') || '';
if (id) {
  loadProfile(id.toUpperCase());
} else {
  showNotFound();
}
</script>
</body>
</html>
