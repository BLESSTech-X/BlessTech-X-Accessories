<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Profile — PhoneYa2</title>
<meta name="description" content="View a PhoneYa2-ZM verified sales agent's profile.">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
.profile-wrap { max-width: 560px; margin: 40px auto; padding: 0 20px 80px; }

.profile-hero {
  background: linear-gradient(135deg,#0a0a1a,#1c1c3a);
  border-radius: var(--r2);
  padding: 32px 24px 28px;
  text-align: center;
  color: white;
  position: relative;
  overflow: hidden;
  margin-bottom: 20px;
}
.profile-hero::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(255,96,0,.25), transparent 70%);
  border-radius: 50%;
}
.profile-hero-inner { position: relative; z-index: 1; }

.profile-photo {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid rgba(255,255,255,.15);
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
  margin: 0 auto 16px;
  background: #eee;
  display: block;
}
.profile-photo-fallback {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff6000,#ff9f43);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne',sans-serif;
  font-weight: 800;
  font-size: 48px;
  color: white;
  margin: 0 auto 16px;
  border: 4px solid rgba(255,255,255,.15);
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
}

.profile-verified-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(37,211,102,.15);
  color: #4ade80;
  border: 1px solid rgba(37,211,102,.35);
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 14px;
}
.profile-name {
  font-family: 'Syne',sans-serif;
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 6px;
  line-height: 1.2;
  word-break: break-word;
}
.profile-id-line {
  font-size: 13px;
  color: rgba(255,255,255,.55);
  font-family: ui-monospace, Menlo, monospace;
  word-break: break-all;
}
.profile-level {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg,#7c3aed,#a855f7);
  color: white;
  font-size: 11px;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 100px;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-top: 14px;
}

.profile-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.profile-stat {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px 12px;
  text-align: center;
}
.profile-stat-val {
  font-family: 'DM Sans',sans-serif;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 4px;
  word-break: break-word;
}
.profile-stat-lbl {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.profile-info-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 20px 22px;
  margin-bottom: 20px;
}
.profile-info-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}
.profile-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.profile-row:last-child { border-bottom: none; }
.profile-lbl { color: var(--muted); font-weight: 600; flex-shrink: 0; }
.profile-val { color: var(--text); font-weight: 700; text-align: right; word-break: break-word; }

/* ── DOCUMENTS ──────────────────────────────────────────────────────────── */
.profile-docs-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 20px 22px;
  margin-bottom: 20px;
}
.profile-docs-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
}
.profile-doc-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.profile-doc-item:last-child { border-bottom: none; }
.profile-doc-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
}
.profile-doc-icon.orange { background: linear-gradient(135deg,#fff8f4,#ffe0cc); color: var(--orange); }
.profile-doc-icon.purple { background: linear-gradient(135deg,#f3e8ff,#e9d5ff); color: #7c3aed; }
.profile-doc-icon.yellow { background: linear-gradient(135deg,#fffbeb,#fef3c7); color: #d97706; }
.profile-doc-body { flex: 1; min-width: 0; }
.profile-doc-name {
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  margin-bottom: 3px;
  line-height: 1.3;
}
.profile-doc-hint {
  font-size: 11px;
  color: var(--muted);
}
.profile-doc-btn {
  background: var(--grad-o);
  color: white;
  border: none;
  font-size: 11px;
  font-weight: 800;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: opacity .2s;
  flex-shrink: 0;
  white-space: nowrap;
}
.profile-doc-btn:hover { opacity: .85; }
.profile-doc-btn:disabled { opacity: .5; cursor: not-allowed; }
.profile-doc-btn.locked {
  background: var(--light);
  color: var(--muted);
  cursor: not-allowed;
}

.qr-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 24px;
  text-align: center;
  margin-bottom: 20px;
}
.qr-card h3 { font-size: 1rem; margin-bottom: 4px; }
.qr-card p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.qr-card #qrBox {
  display: inline-flex;
  padding: 16px;
  background: white;
  border-radius: var(--r);
  border: 1px solid var(--border);
  margin-bottom: 16px;
}

.profile-cta { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.profile-cta .btn { flex: 1; min-width: 160px; justify-content: center; }

.profile-state { text-align: center; padding: 60px 24px; }
.profile-state-icon { font-size: 3rem; margin-bottom: 12px; }
.profile-state h3 { font-size: 1.1rem; margin-bottom: 8px; }
.profile-state p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
  max-width: 400px;
  margin: 0 auto 20px;
}

/* ── RANK STATS CARD ────────────────────────────────────────────────────── */
.rank-stats-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 20px 22px;
  margin-bottom: 20px;
}
.rank-stats-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
}
.rank-stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.rank-stat-cell {
  text-align: center;
  padding: 12px 8px;
  background: var(--light);
  border-radius: var(--r);
}
.rank-stat-val {
  font-family: 'DM Sans',sans-serif;
  font-size: 1.2rem;
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 4px;
  word-break: break-word;
}
.rank-stat-lbl {
  font-size: 10px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}

/* ── BADGE CHIPS ────────────────────────────────────────────────────────── */
.badge-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 800;
  background: var(--light);
  color: var(--text);
  margin-right: 6px;
  margin-bottom: 6px;
}
.badge-chip.gold   { background: linear-gradient(135deg,#fef3c7,#fde68a); color:#92400e; }
.badge-chip.fire   { background: linear-gradient(135deg,#fee2e2,#fecaca); color:#991b1b; }
.badge-chip.target { background: linear-gradient(135deg,#ede9fe,#ddd6fe); color:#5b21b6; }
.badge-chip.grad   { background: linear-gradient(135deg,#dbeafe,#bfdbfe); color:#1e40af; }

/* ── AGENTS DIRECTORY ───────────────────────────────────────────────────── */
.directory-wrap {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px 80px;
}
.directory-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.directory-head h1 {
  font-family: 'Syne',sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
}
.directory-head p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}
.directory-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
}
.directory-search {
  flex: 1;
  min-width: 220px;
  display: flex;
  background: white;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color .2s;
}
.directory-search:focus-within { border-color: var(--orange); }
.directory-search input {
  flex: 1;
  border: none;
  outline: none;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'DM Sans',sans-serif;
  min-width: 0;
}
.directory-search i {
  padding: 11px 12px;
  color: var(--muted);
  flex-shrink: 0;
}
.directory-sort {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: white;
  font-family: 'DM Sans',sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  outline: none;
  cursor: pointer;
  max-width: 200px;
}
.directory-sort:focus { border-color: var(--orange); }
.directory-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.directory-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  gap: 14px;
  align-items: center;
  text-decoration: none;
  color: inherit;
  transition: all .2s;
}
.directory-card:hover {
  border-color: var(--orange);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,.06);
  text-decoration: none;
  color: inherit;
}
.dir-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--light);
}
.dir-avatar-fallback {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff6000,#ff9f43);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-family: 'Syne',sans-serif;
  font-weight: 800;
  font-size: 22px;
  flex-shrink: 0;
}
.dir-body { flex: 1; min-width: 0; }
.dir-name {
  font-weight: 800;
  font-size: 15px;
  margin-bottom: 3px;
  word-break: break-word;
}
.dir-meta {
  font-size: 11px;
  color: var(--muted);
  word-break: break-word;
}
.dir-stats {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.dir-stats strong { color: var(--orange); font-weight: 800; }

html, body { overflow-x: hidden; }
@media(max-width:480px) {
  .profile-wrap { margin: 20px auto; padding: 0 14px 60px; }
  .profile-photo, .profile-photo-fallback { width: 100px; height: 100px; font-size: 40px; }
  .profile-name { font-size: 1.25rem; }
  .profile-stats { gap: 8px; }
  .profile-stat { padding: 14px 8px; }
  .profile-stat-val { font-size: 1.15rem; }
  .profile-doc-btn { padding: 6px 10px; font-size: 10px; }
  .profile-doc-icon { width: 36px; height: 36px; font-size: 1rem; }
  .directory-wrap { margin: 20px auto; padding: 0 14px 60px; }
  .directory-head h1 { font-size: 1.3rem; }
  .directory-sort { max-width: 100%; }
  .rank-stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div id="nav-wrap"></div>

<div class="profile-wrap">

  <div id="loadingState" class="profile-state">
    <div class="spinner dark" style="margin: 0 auto 16px; width: 32px; height: 32px;"></div>
    <p style="color:var(--muted);font-size:14px;">Loading agent profile…</p>
  </div>

  <div id="profileContent" style="display:none;"></div>

  <div id="notFoundState" class="profile-state" style="display:none;">
    <div class="profile-state-icon">🔍</div>
    <h3>Agent Not Found</h3>
    <p>We could not find a verified PhoneYa2-ZM agent matching this ID. The agent may be inactive, or the link may be incorrect.</p>
    <div class="profile-cta">
      <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
      <a href="verify.html" class="btn btn-outline"><i class="fas fa-shield-halved"></i> Verify Another</a>
    </div>
  </div>

</div>

<div id="directoryWrap" class="directory-wrap" style="display:none;"></div>

<div id="toast"></div>

<script src="config.js"></script>
<script>
document.getElementById('nav-wrap').innerHTML = buildNav('public');

// Local helper — kept inside profile.html to avoid touching config.js.
function publicCity(raw) {
  if (!raw) return '';
  const parts = String(raw).split(',').map(s => s.trim()).filter(Boolean);
  if (parts.length === 0) return '';
  if (parts.length === 1) return parts[0];
  const last = parts[parts.length - 1];
  const isCountry = /^(zambia|zm|zambia\.?)$/i.test(last);
  return isCountry ? parts[parts.length - 2] : last;
}

// Local helper — the agent_leaderboard view must exist in Supabase.
// If the view is missing, this returns [] and pages degrade gracefully.
const _LB_METRIC_COLUMN = {
  sales:      'confirmed_revenue',
  commission: 'confirmed_commission',
  chat:       'messages_30d',
  recruiters: 'referred_agents_count',
  learners:   'modules_completed',
};

async function getLeaderboard(metric = 'sales') {
  const col = _LB_METRIC_COLUMN[metric] || 'confirmed_revenue';
  try {
    return await db.getAll('agent_leaderboard', {
      order: `${col}.desc,agent_code.asc`,
      limit: 100,
    });
  } catch (e) { return []; }
}

let currentAgent = null;
let currentLevel = null;
let _dirRows = [];
let _dirSort = 'recent';

// ═══════════════════════════════════════════════════════════════════════
// LOAD PROFILE
// ═══════════════════════════════════════════════════════════════════════
async function loadProfile(identifier) {
  if (!identifier) return showNotFound();

  try {
    let agent = await db.getOne('agents', `agent_id=eq.${encodeURIComponent(identifier)}&active=eq.true`);
    if (!agent) {
      agent = await db.getOne('agents', `agent_code=eq.${encodeURIComponent(identifier)}&active=eq.true`);
    }
    if (!agent) return showNotFound();

    currentAgent = agent;
    await loadLevels();
    await loadTiers();

    // ── Aggregate stats from the leaderboard view (single row per agent).
    let stats = null;
    try {
      const rows = await db.getAll('agent_leaderboard', { filter: `agent_code=eq.${agent.agent_code}`, limit: 1 });
      stats = rows?.[0] || null;
    } catch (e) { stats = null; }

    // ── Ranks across all metrics. Admin occupies rank #1, so agents
    //    start at #2 — same convention as the agent dashboard.
    const ranks = { sales: null, commission: null, chat: null, recruiters: null, learners: null };
    const metricKeys = ['sales', 'commission', 'chat', 'recruiters', 'learners'];
    for (const m of metricKeys) {
      try {
        const lb = await getLeaderboard(m);
        const idx = lb.findIndex(r => r.agent_code === agent.agent_code);
        ranks[m] = idx >= 0 ? idx + 2 : null;
      } catch (e) { ranks[m] = null; }
    }

    // ── Privacy gate: phone / WhatsApp only for the agent themselves,
    //    and only if their own row is still active.
    let viewerIsSelf = false;
    try {
      if (auth.isLoggedIn()) {
        const myProfile = await getProfile();
        if (myProfile && myProfile.agent_code === agent.agent_code && agent.active === true) {
          viewerIsSelf = true;
        }
      }
    } catch (e) {}

    // ── Training completion flag for the Achievement certificate.
    let trainingDone = false;
    try {
      const allModules = await db.getAll('training_modules', { filter: 'active=eq.true' });
      const progress  = await db.getAll('training_progress', { filter: `agent_code=eq.${agent.agent_code}&completed=eq.true` });
      trainingDone = allModules.length > 0 && progress.length === allModules.length;
    } catch (e) {}

    // ── Badges.
    const badges = [];
    if (ranks.sales === 2) badges.push('<span class="badge-chip gold">🥇 Top Seller</span>');
    if ((stats?.messages_30d || 0) > 100) badges.push('<span class="badge-chip fire">🔥 Chatterbox</span>');
    if ((stats?.referred_agents_count || 0) > 2) badges.push('<span class="badge-chip target">🎯 Recruiter</span>');
    if (trainingDone && (stats?.exam_best_pct || 0) >= 80) badges.push('<span class="badge-chip grad">🎓 Graduate</span>');

    const photoHtml = agent.profile_photo_url
      ? `<img src="${esc(agent.profile_photo_url)}" alt="${esc(agent.full_name)}" class="profile-photo"
              onerror="this.style.display='none';this.nextElementSibling && (this.nextElementSibling.style.display='flex');">
         <div class="profile-photo-fallback" style="display:none;">${(agent.full_name || '?')[0].toUpperCase()}</div>`
      : `<div class="profile-photo-fallback">${(agent.full_name || '?')[0].toUpperCase()}</div>`;

    const city = publicCity(agent.location);

    // ── Level label (Starter / Active / Performer …) from existing levels.
    let levelLabel = '';
    try {
      const salesCount  = stats?.confirmed_sales_count || 0;
      const revenueSum  = Number(stats?.confirmed_revenue || 0);
      const lvl = calcAgentLevel(salesCount, revenueSum);
      if (lvl && lvl.current) levelLabel = lvl.current.name;
    } catch (e) {}

    // ── Self-only contact rows (Phone + WhatsApp, NO email).
    const contactRows = viewerIsSelf ? `
      <div class="profile-info-card">
        <div class="profile-info-title"><i class="fas fa-address-card"></i> My Contact Details</div>
        <div class="profile-row"><span class="profile-lbl">Phone</span><span class="profile-val">${esc(agent.phone || '—')}</span></div>
        <div class="profile-row"><span class="profile-lbl">WhatsApp</span><span class="profile-val">${esc(agent.whatsapp || '—')}</span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;">
          <i class="fas fa-lock"></i> Only visible to you. Other agents and visitors cannot see these.
        </div>
      </div>` : '';

    document.getElementById('profileContent').innerHTML = `
      <div class="profile-hero">
        <div class="profile-hero-inner">
          ${photoHtml}
          <div class="profile-verified-badge">
            <i class="fas fa-circle-check"></i> Verified Agent
          </div>
          <div class="profile-name">${esc(agent.full_name)}</div>
          <div class="profile-id-line">${esc(agent.agent_id)} · ${esc(agent.agent_code)}</div>
          ${levelLabel ? `<div class="profile-level"><i class="fas fa-award"></i> ${esc(levelLabel)}</div>` : ''}
          <div style="margin-top:16px;">
            <a href="profile.html" class="btn btn-outline btn-sm"
               style="color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.25);">
              <i class="fas fa-arrow-left"></i> All agents
            </a>
          </div>
        </div>
      </div>

      ${badges.length ? `<div style="margin-bottom:18px;text-align:center;">${badges.join('')}</div>` : ''}

      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-val" style="color:var(--orange);">${stats?.confirmed_sales_count || 0}</div>
          <div class="profile-stat-lbl">Sales</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-val" style="color:#16a34a;">${fmtMoney(stats?.confirmed_revenue || 0)}</div>
          <div class="profile-stat-lbl">Revenue</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-val">${stats?.leads_count || 0}</div>
          <div class="profile-stat-lbl">Leads</div>
        </div>
      </div>

      <div class="rank-stats-card">
        <div class="rank-stats-title"><i class="fas fa-ranking-star"></i> Ranks &amp; Activity</div>
        <div class="rank-stats-grid">
          <div class="rank-stat-cell">
            <div class="rank-stat-val" style="color:var(--orange);">${ranks.sales ? '#' + ranks.sales : '—'}</div>
            <div class="rank-stat-lbl">Sales Rank</div>
          </div>
          <div class="rank-stat-cell">
            <div class="rank-stat-val" style="color:#16a34a;">${ranks.commission ? '#' + ranks.commission : '—'}</div>
            <div class="rank-stat-lbl">Commission Rank</div>
          </div>
          <div class="rank-stat-cell">
            <div class="rank-stat-val" style="color:#7c3aed;">${ranks.chat ? '#' + ranks.chat : '—'}</div>
            <div class="rank-stat-lbl">Chat Rank</div>
          </div>
          <div class="rank-stat-cell">
            <div class="rank-stat-val">${ranks.recruiters ? '#' + ranks.recruiters : '—'}</div>
            <div class="rank-stat-lbl">Recruiter Rank</div>
          </div>
          <div class="rank-stat-cell">
            <div class="rank-stat-val">${ranks.learners ? '#' + ranks.learners : '—'}</div>
            <div class="rank-stat-lbl">Learner Rank</div>
          </div>
        </div>
        <div class="rank-stats-grid" style="margin-top:14px;">
          <div class="rank-stat-cell">
            <div class="rank-stat-val">${fmtMoney(stats?.confirmed_commission || 0)}</div>
            <div class="rank-stat-lbl">Commission</div>
          </div>
          <div class="rank-stat-cell">
            <div class="rank-stat-val">${stats?.messages_30d || 0}</div>
            <div class="rank-stat-lbl">Messages (30d)</div>
          </div>
          <div class="rank-stat-cell">
            <div class="rank-stat-val">${stats?.referred_agents_count || 0}</div>
            <div class="rank-stat-lbl">Recruits</div>
          </div>
          <div class="rank-stat-cell">
            <div class="rank-stat-val">${stats?.modules_completed || 0}</div>
            <div class="rank-stat-lbl">Modules</div>
          </div>
          <div class="rank-stat-cell">
            <div class="rank-stat-val">${stats?.exam_best_pct || 0}%</div>
            <div class="rank-stat-lbl">Exam Best</div>
          </div>
        </div>
      </div>

      <div class="profile-info-card">
        <div class="profile-info-title"><i class="fas fa-id-card"></i> Agent Details</div>
        <div class="profile-row">
          <span class="profile-lbl">Full Name</span>
          <span class="profile-val">${esc(agent.full_name)}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Agent ID</span>
          <span class="profile-val" style="font-family:monospace;color:var(--orange);">${esc(agent.agent_id)}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Agent Code</span>
          <span class="profile-val" style="font-family:monospace;color:var(--orange);">${esc(agent.agent_code)}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Location</span>
          <span class="profile-val">${esc(city || '—')}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Joined</span>
          <span class="profile-val">${fmtDate(agent.joined_at)}</span>
        </div>
        <div class="profile-row">
          <span class="profile-lbl">Status</span>
          <span class="profile-val"><span class="pill-approved">Active</span></span>
        </div>
      </div>

      ${contactRows}

      <div class="profile-docs-card">
        <div class="profile-docs-title"><i class="fas fa-folder-open"></i> Official Documents</div>

        <div class="profile-doc-item">
          <div class="profile-doc-icon orange"><i class="fas fa-id-card"></i></div>
          <div class="profile-doc-body">
            <div class="profile-doc-name">Agent ID Card</div>
            <div class="profile-doc-hint">Verified PhoneYa2-ZM Sales Assistant</div>
          </div>
          <button class="profile-doc-btn" onclick="downloadAgentIdCard()">
            <i class="fas fa-download"></i> PDF
          </button>
        </div>

        <div class="profile-doc-item">
          <div class="profile-doc-icon purple"><i class="fas fa-certificate"></i></div>
          <div class="profile-doc-body">
            <div class="profile-doc-name">Certificate of Participation</div>
            <div class="profile-doc-hint">Official member of PhoneYa2-ZM Agent Network</div>
          </div>
          <button class="profile-doc-btn" onclick="downloadParticipationCert()">
            <i class="fas fa-download"></i> PDF
          </button>
        </div>

        ${trainingDone ? `
        <div class="profile-doc-item">
          <div class="profile-doc-icon yellow"><i class="fas fa-award"></i></div>
          <div class="profile-doc-body">
            <div class="profile-doc-name">Certificate of Achievement</div>
            <div class="profile-doc-hint">Completed all training modules</div>
          </div>
          <button class="profile-doc-btn" onclick="downloadAchievementCert()">
            <i class="fas fa-download"></i> PDF
          </button>
        </div>
        ` : `
        <div class="profile-doc-item">
          <div class="profile-doc-icon yellow" style="opacity:.5;"><i class="fas fa-award"></i></div>
          <div class="profile-doc-body">
            <div class="profile-doc-name" style="opacity:.6;">Certificate of Achievement</div>
            <div class="profile-doc-hint">Locked — training in progress</div>
          </div>
          <button class="profile-doc-btn locked" disabled>
            <i class="fas fa-lock"></i> Locked
          </button>
        </div>
        `}
      </div>

      <div class="qr-card">
        <h3>Scan to Verify</h3>
        <p>Customers can scan this QR code to confirm this agent is legitimate.</p>
        <div id="qrBox"></div>
        <div class="profile-cta">
          <a href="verify.html?id=${esc(agent.agent_id)}" class="btn btn-outline btn-sm">
            <i class="fas fa-shield-halved"></i> Open Verification
          </a>
          <button class="btn btn-outline btn-sm" onclick="copyVerifyLink('${esc(agent.agent_id)}')">
            <i class="fas fa-copy"></i> Copy Link
          </button>
        </div>
      </div>

      <div class="profile-cta">
        <a href="${waLink('Hi! I would like to order PhoneYa2-ZM products from ' + agent.full_name + ' (' + agent.agent_code + ').')}" target="_blank" class="btn btn-green">
          <i class="fab fa-whatsapp"></i> Order via WhatsApp        </a>
        <a href="index.html" class="btn btn-outline">
          <i class="fas fa-home"></i> PhoneYa2 Home
        </a>
      </div>
    `;

    const verifyUrl = `${CONFIG.agentSiteUrl}/verify.html?id=${agent.agent_id}`;
    new QRCode(document.getElementById('qrBox'), {
      text: verifyUrl,
      width: 160,
      height: 160,
      correctLevel: QRCode.CorrectLevel.H,
    });

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('profileContent').style.display = 'block';
  } catch (e) {
    console.error(e);
    toast('⚠️  ' + e.message);
    showNotFound();
  }
}

function showNotFound() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('profileContent').style.display = 'none';
  document.getElementById('directoryWrap').style.display = 'none';
  document.getElementById('notFoundState').style.display = 'block';
}

function copyVerifyLink(agentId) {
  copyToClipboard(`${CONFIG.agentSiteUrl}/verify.html?id=${agentId}`);
  toast('✅ Verification link copied');
}

// ═══════════════════════════════════════════════════════════════════════
// AGENTS DIRECTORY
// ═══════════════════════════════════════════════════════════════════════
async function showDirectory() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('profileContent').style.display = 'none';
  document.getElementById('notFoundState').style.display = 'none';

  const wrap = document.getElementById('directoryWrap');
  wrap.style.display = 'block';

  wrap.innerHTML = `
    <div class="directory-head">
      <div>
        <h1>Agents Directory</h1>
        <p>All verified PhoneYa2-ZM sales agents.</p>
      </div>
      <a href="index.html" class="btn btn-outline btn-sm"><i class="fas fa-home"></i> Home</a>
    </div>
    <div class="directory-controls">
      <div class="directory-search">
        <i class="fas fa-search"></i>
        <input type="text" id="dirSearch" placeholder="Search by name or code…" oninput="renderDirectory()">
      </div>
      <select class="directory-sort" id="dirSort" onchange="onDirSortChange()">
        <option value="recent">Recently joined</option>
        <option value="sales">Top sellers</option>
        <option value="chat">Most active</option>
      </select>
    </div>
    <div class="directory-grid" id="dirGrid">
      <div style="text-align:center;padding:40px;color:var(--muted);grid-column:1/-1;">
        <i class="fas fa-spinner fa-spin"></i> Loading agents…
      </div>
    </div>`;

  try {
    _dirRows = await getLeaderboard('sales');
  } catch (e) {
    _dirRows = [];
  }
  renderDirectory();
}

function onDirSortChange() {
  _dirSort = document.getElementById('dirSort').value || 'recent';
  renderDirectory();
}

function renderDirectory() {
  const grid = document.getElementById('dirGrid');
  if (!grid) return;
  const q = (document.getElementById('dirSearch')?.value || '').trim().toLowerCase();

  let rows = [..._dirRows];
  if (q) {
    rows = rows.filter(r =>
      (r.full_name || '').toLowerCase().includes(q) ||
      (r.agent_code || '').toLowerCase().includes(q)
    );
  }

  if (_dirSort === 'sales') {
    rows.sort((a, b) => (b.confirmed_sales_count || 0) - (a.confirmed_sales_count || 0));
  } else if (_dirSort === 'chat') {
    rows.sort((a, b) => (b.messages_30d || 0) - (a.messages_30d || 0));
  } else {
    rows.sort((a, b) => new Date(b.joined_at || 0) - new Date(a.joined_at || 0));
  }

  if (!rows.length) {
    grid.innerHTML = `
      <div style="text-align:center;padding:48px;color:var(--muted);grid-column:1/-1;">
        <div style="font-size:2rem;margin-bottom:8px;">🔎</div>
        <div>No agents found.</div>
      </div>`;
    return;
  }

  grid.innerHTML = rows.map(r => {
    const avatar = r.profile_photo_url
      ? `<img class="dir-avatar" src="${esc(r.profile_photo_url)}" alt="${esc(r.full_name || 'Agent')}"
              onerror="this.style.display='none';this.nextElementSibling && (this.nextElementSibling.style.display='flex');">
         <div class="dir-avatar-fallback" style="display:none;">${esc((r.full_name || '?')[0].toUpperCase())}</div>`
      : `<div class="dir-avatar-fallback">${esc((r.full_name || '?')[0].toUpperCase())}</div>`;

    const city = publicCity(r.location);

    return `<a class="directory-card" href="profile.html?id=${esc(r.agent_id)}">
      ${avatar}
      <div class="dir-body">
        <div class="dir-name">${esc(r.full_name || r.agent_code)}</div>
        <div class="dir-meta">${esc(r.agent_code)}${city ? ' · ' + esc(city) : ''}</div>
        <div class="dir-stats">
          <span><strong>${r.confirmed_sales_count || 0}</strong> sales</span>
          <span><strong>${r.messages_30d || 0}</strong> msgs</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════════════
// DOCUMENT DOWNLOADS
// ═══════════════════════════════════════════════════════════════════════
async function downloadAgentIdCard() {
  if (!currentAgent) return;
  toast('🎫 Generating ID card…');
  try { await makeIdCardPdf(currentAgent); }
  catch(e) { toast('Error: ' + e.message); }
}

function downloadParticipationCert() {
  if (!currentAgent) return;
  toast('🏅 Generating certificate…');
  try { makeParticipationCertificatePdf(currentAgent); }
  catch(e) { toast('Error: ' + e.message); }
}

function downloadAchievementCert() {
  if (!currentAgent) return;
  toast('🏆 Generating certificate…');
  try {
    makeCertificatePdf({
      agent: currentAgent,
      title: 'Certificate of Achievement',
      subtitle: 'Proudly awarded to',
      date: new Date().toLocaleDateString('en-ZM'),
    });
  } catch(e) { toast('Error: ' + e.message); }
}

// ═══════════════════════════════════════════════════════════════════════
// URL PARSING
// ═══════════════════════════════════════════════════════════════════════
const params = new URLSearchParams(window.location.search);
const id     = params.get('id') || params.get('code') || '';
if (id) {
  loadProfile(id.toUpperCase());
} else {
  showDirectory();
}
</script>
