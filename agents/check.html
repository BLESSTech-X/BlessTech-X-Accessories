<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Application Status — PhoneYa2 Agent Network</title>
<meta name="description" content="Check the status of your PhoneYa2 Sales Agent application.">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.check-wrap { max-width: 560px; margin: 40px auto; padding: 0 20px 80px; }
.check-hero { text-align: center; margin-bottom: 28px; }
.check-hero-icon { font-size: 3rem; margin-bottom: 8px; }
.check-hero h1 { font-size: 1.6rem; margin-bottom: 8px; }
.check-hero p  { color: var(--muted); font-size: 14px; }

.check-card {
  background: white; border-radius: var(--r2); border: 1px solid var(--border);
  box-shadow: var(--shadow2); padding: 28px 24px;
}

.status-card {
  background: white; border-radius: var(--r2); border: 1px solid var(--border);
  box-shadow: var(--shadow2); overflow: hidden; margin-top: 24px;
}

.status-hdr {
  padding: 24px; text-align: center;
}
.status-hdr.approved  { background: linear-gradient(135deg,#0d2010,#0a3518); border-bottom: 1px solid rgba(37,211,102,.2); }
.status-hdr.pending   { background: linear-gradient(135deg,#2a1a05,#3a2408); border-bottom: 1px solid rgba(245,158,11,.2); }
.status-hdr.review    { background: linear-gradient(135deg,#0a1a2a,#0a2038); border-bottom: 1px solid rgba(37,99,235,.2); }
.status-hdr.rejected  { background: linear-gradient(135deg,#2a0a0a,#3a1010); border-bottom: 1px solid rgba(239,68,68,.2); }

.status-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 100px;
  font-size: 13px; font-weight: 800; letter-spacing: .3px;
  text-transform: uppercase;
}
.status-badge.approved { background: rgba(37,211,102,.15); color: #4ade80; border: 1px solid rgba(37,211,102,.4); }
.status-badge.pending  { background: rgba(245,158,11,.15); color: #fbbf24; border: 1px solid rgba(245,158,11,.4); }
.status-badge.review   { background: rgba(96,165,250,.15); color: #60a5fa; border: 1px solid rgba(96,165,250,.4); }
.status-badge.rejected { background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.4); }

.status-body { padding: 24px; }
.status-row {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px;
}
.status-row:last-child { border-bottom: none; }
.status-lbl { color: var(--muted); font-weight: 600; flex-shrink: 0; }
.status-val { color: var(--text); font-weight: 700; text-align: right; word-break: break-word; }

.status-message {
  margin-top: 20px; padding: 16px 18px; border-radius: var(--r);
  font-size: 14px; line-height: 1.6;
}
.status-message.approved { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
.status-message.pending  { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
.status-message.review   { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
.status-message.rejected { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

.status-actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
.status-actions .btn { flex: 1; min-width: 140px; justify-content: center; }

html, body { overflow-x: hidden; }
* { min-width: 0; }

@media(max-width:480px) {
  .check-wrap { margin: 20px auto; padding: 0 14px 60px; }
  .check-hero h1 { font-size: 1.35rem; }
  .check-card { padding: 20px 18px; }
  .status-row { flex-direction: column; gap: 3px; padding: 10px 0; }
  .status-val { text-align: left; }
  .status-actions .btn { width: 100%; }
}
</style>
</head>
<body>

<div id="nav-wrap"></div>

<div class="check-wrap">

  <div class="check-hero">
    <div class="check-hero-icon">🔍</div>
    <h1>Check Your Application Status</h1>
    <p>Enter your Application ID, phone number, or email to see the latest update.</p>
  </div>

  <div class="check-card">
    <div class="field">
      <label class="label">Application ID, Phone, or Email <span class="req">*</span></label>
      <input type="text" class="input" id="lookupInput"
             placeholder="e.g. PY-2026-0001 or +260 979 603 741"
             onkeydown="if(event.key==='Enter') doLookup()">
      <div class="err-msg" id="lookupErr">Please enter something to search.</div>
    </div>
    <button class="btn btn-primary btn-full" id="lookupBtn" onclick="doLookup()">
      <i class="fas fa-search"></i> Check Status
    </button>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted);">
      Don't have an application yet?
      <a href="apply.html" style="font-weight:600;">Apply now →</a>
    </div>
  </div>

  <div id="resultArea"></div>

  <div style="text-align:center;margin-top:32px;">
    <a href="index.html" class="btn btn-outline btn-sm">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
  </div>

</div>

<div id="toast"></div>

<script src="config.js"></script>
<script>
document.getElementById('nav-wrap').innerHTML = buildNav('public');

// ── STATUS DEFINITIONS ─────────────────────────────────────────────────────
// Maps every status the application might have → display + message
const STATUS_MAP = {
  pending:                    { label: 'Submitted',                cls: 'pending',  msg: 'Your application has been received. It is now in the queue for review. We usually respond within 1–3 days.' },
  submitted:                  { label: 'Submitted',                cls: 'pending',  msg: 'Your application has been received and is awaiting review.' },
  under_review:               { label: 'Under Review',             cls: 'review',   msg: 'Our team is reviewing your application. This usually takes 1–3 days.' },
  shortlisted:                { label: 'Shortlisted',              cls: 'review',   msg: 'Good news — you have been shortlisted! We will contact you soon for the next step.' },
  interview:                  { label: 'Interview Stage',          cls: 'review',   msg: 'You have reached the interview stage. Check your WhatsApp for scheduling details.' },
  more_information_required:  { label: 'More Information Needed',  cls: 'review',   msg: 'We need a bit more information from you. Please check your WhatsApp or email and respond as soon as possible.' },
  trial_period:               { label: 'Trial Period',             cls: 'review',   msg: 'You are currently on a trial period. Keep selling — your performance will determine final approval.' },
  approved:                   { label: 'Approved',                 cls: 'approved', msg: 'Congratulations! Your application has been approved. Check your WhatsApp — we have sent your Agent ID and Code.' },
  active:                     { label: 'Active',                   cls: 'approved', msg: 'Your agent account is active. You can start selling immediately.' },
  rejected:                   { label: 'Not Approved',             cls: 'rejected', msg: 'Unfortunately your application was not successful at this time. You are welcome to apply again in the future.' },
  inactive:                   { label: 'Inactive',                 cls: 'rejected', msg: 'Your application is currently inactive. Contact us on WhatsApp if you have any questions.' },
  suspended:                  { label: 'Suspended',                cls: 'rejected', msg: 'Your account is suspended. Please contact PhoneYa2 on WhatsApp for more information.' },
};

function getStatusInfo(status) {
  const key = (status || 'pending').toLowerCase();
  return STATUS_MAP[key] || {
    label: status || 'Unknown',
    cls:   'pending',
    msg:   'Your application is being processed. We will update you soon.'
  };
}

// ── LOOKUP ────────────────────────────────────────────────────────────────
async function doLookup() {
  const input = document.getElementById('lookupInput').value.trim();
  const errEl = document.getElementById('lookupErr');

  if (!input) {
    errEl.classList.add('show');
    return;
  }
  errEl.classList.remove('show');

  const btn = document.getElementById('lookupBtn');
  setLoading(btn, true, 'Searching…');
  document.getElementById('resultArea').innerHTML = '';

  try {
    const app = await findApplication(input);
    if (!app) {
      showNotFound(input);
    } else {
      showResult(app);
    }
  } catch (e) {
    toast('⚠️  ' + e.message);
  } finally {
    setLoading(btn, false, '<i class="fas fa-search"></i> Check Status');
  }
}

async function findApplication(input) {
  // Try in this order: App ID, Phone, WhatsApp, Email
  const cleanInput = input.trim();
  const digitsOnly = cleanInput.replace(/\D/g, '');

  // 1. Try App ID (matches format PY-2026-0001 or PY-2026-0001 exact)
  if (cleanInput.toUpperCase().startsWith('PY-')) {
    const byId = await db.getOne('applications', `app_id=eq.${cleanInput.toUpperCase()}`);
    if (byId) return byId;
  }

  // 2. Try phone
  if (digitsOnly.length >= 9) {
    // Try exact match first
    let byPhone = await db.getOne('applications', `phone=eq.${cleanInput}`);
    if (byPhone) return byPhone;

    // Try WhatsApp
    let byWa = await db.getOne('applications', `whatsapp=eq.${cleanInput}`);
    if (byWa) return byWa;

    // Try partial match (last 9 digits)
    const last9 = digitsOnly.slice(-9);
    const all = await db.getAll('applications', { order: 'created_at.desc', limit: 50 });
    const match = all.find(a =>
      (a.phone && a.phone.replace(/\D/g, '').endsWith(last9)) ||
      (a.whatsapp && a.whatsapp.replace(/\D/g, '').endsWith(last9))
    );
    if (match) return match;
  }

  // 3. Try email
  if (cleanInput.includes('@')) {
    const byEmail = await db.getOne('applications', `email=eq.${cleanInput.toLowerCase()}`);
    if (byEmail) return byEmail;
    const byEmailUpper = await db.getOne('applications', `email=eq.${cleanInput}`);
    if (byEmailUpper) return byEmailUpper;
  }

  return null;
}

// ── DISPLAY RESULT ────────────────────────────────────────────────────────
function showResult(app) {
  const info = getStatusInfo(app.status);
  const area = document.getElementById('resultArea');

  area.innerHTML = `
    <div class="status-card">
      <div class="status-hdr ${info.cls}">
        <div class="status-badge ${info.cls}">
          <i class="fas ${info.cls === 'approved' ? 'fa-circle-check' : info.cls === 'rejected' ? 'fa-circle-xmark' : 'fa-hourglass-half'}"></i>
          ${info.label}
        </div>
      </div>
      <div class="status-body">
        <div class="status-row">
          <span class="status-lbl">Application ID</span>
          <span class="status-val" style="color:var(--orange);font-family:monospace;">${esc(app.app_id)}</span>
        </div>
        <div class="status-row">
          <span class="status-lbl">Full Name</span>
          <span class="status-val">${esc(app.full_name)}</span>
        </div>
        <div class="status-row">
          <span class="status-lbl">Submitted</span>
          <span class="status-val">${fmtDate(app.created_at)}</span>
        </div>
        <div class="status-row">
          <span class="status-lbl">Location</span>
          <span class="status-val">${esc(app.location || '—')}</span>
        </div>

        <div class="status-message ${info.cls}">
          <i class="fas fa-info-circle" style="margin-right:6px;"></i>
          ${info.msg}
        </div>

        <div class="status-actions">
          ${info.cls === 'approved' && app.status !== 'approved' ? '' : ''}
          ${app.status === 'approved' ? `
            <a href="agent.html" class="btn btn-green">
              <i class="fas fa-right-to-bracket"></i> Open Agent Dashboard
            </a>
          ` : ''}
          <a href="${waLink('Hi PhoneYa2! I am checking my agent application status. My Application ID is ' + app.app_id + '. Thank you!')}" target="_blank" class="btn btn-outline">
            <i class="fab fa-whatsapp"></i> Ask on WhatsApp
          </a>
        </div>
      </div>
    </div>`;
}

function showNotFound(input) {
  const area = document.getElementById('resultArea');
  area.innerHTML = `
    <div class="card" style="margin-top:24px;text-align:center;padding:40px 24px;">
      <div style="font-size:3rem;margin-bottom:12px;">🔍</div>
      <h3 style="margin-bottom:8px;">No application found</h3>
      <p style="font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:20px;">
        We couldn't find an application matching "<strong>${esc(input)}</strong>".<br>
        Check your spelling, or try your phone number instead.
      </p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <a href="apply.html" class="btn btn-primary">
          <i class="fas fa-pen-to-square"></i> Apply Now
        </a>
        <a href="${waLink('Hi PhoneYa2! I am trying to check my application status but could not find it. My details are: ' + input)}" target="_blank" class="btn btn-outline">
          <i class="fab fa-whatsapp"></i> Ask on WhatsApp
        </a>
      </div>
    </div>`;
}

// ── AUTO-LOOKUP IF URL HAS ?id= OR ?q= ───────────────────────────────────
const params = new URLSearchParams(window.location.search);
const q = params.get('id') || params.get('q') || '';
if (q) {
  document.getElementById('lookupInput').value = q;
  doLookup();
}
</script>
</body>
</html>
