<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Agent — PhoneYa2</title>
<meta name="description" content="Verify that a PhoneYa2-ZM sales agent is legitimate.">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.verify-wrap { max-width: 520px; margin: 48px auto; padding: 0 20px 80px; }

/* Loading state */
.verify-loading { padding: 60px 0; text-align: center; }

/* Verified card */
.verify-card {
  background: white;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow2);
  overflow: hidden;
}

.verify-hdr {
  background: linear-gradient(135deg,#0a0a1a,#1c1c3a);
  padding: 28px 24px 24px;
  text-align: center;
  color: white;
  position: relative;
  overflow: hidden;
}
.verify-hdr::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 180px; height: 180px;
  background: radial-gradient(circle, rgba(37,211,102,.25), transparent 70%);
  border-radius: 50%;
}
.verify-hdr-inner { position: relative; z-index: 1; }

.verify-photo {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid rgba(37,211,102,.35);
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
  margin: 0 auto 16px;
  background: #eee;
  display: block;
}
.verify-photo-fallback {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff6000,#ff9f43);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne',sans-serif;
  font-weight: 800;
  font-size: 40px;
  color: white;
  margin: 0 auto 16px;
  border: 4px solid rgba(37,211,102,.35);
  box-shadow: 0 8px 32px rgba(0,0,0,.35);
}

.verify-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(37,211,102,.15);
  border: 1px solid rgba(37,211,102,.4);
  border-radius: 100px;
  padding: 8px 18px;
  margin-bottom: 14px;
}
.verify-badge i {
  color: var(--green);
  font-size: 1.2rem;
}
.verify-badge span {
  color: white;
  font-weight: 800;
  font-size: 14px;
  letter-spacing: .5px;
}

.verify-title {
  font-family: 'Syne',sans-serif;
  font-size: 1.3rem;
  font-weight: 800;
  margin-bottom: 4px;
  word-break: break-word;
}
.verify-subtitle {
  font-size: 13px;
  color: rgba(255,255,255,.55);
  font-family: ui-monospace, Menlo, monospace;
  word-break: break-all;
}

.verify-body { padding: 24px; }
.verify-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.verify-row:last-child { border-bottom: none; }
.verify-lbl { color: var(--muted); font-weight: 600; flex-shrink: 0; }
.verify-val {
  color: var(--text);
  font-weight: 700;
  text-align: right;
  word-break: break-word;
}

.verify-note {
  margin-top: 20px;
  background: linear-gradient(135deg,#0d2010,#0a3518);
  border-radius: var(--r);
  padding: 18px 20px;
  border: 1px solid rgba(37,211,102,.2);
  text-align: left;
}
.verify-note-title {
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,.45);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.verify-note p {
  font-size: 13px;
  color: rgba(255,255,255,.65);
  line-height: 1.65;
  margin-bottom: 14px;
}

/* Not found state */
.not-found-card {
  background: white;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 40px 28px;
  text-align: center;
}
.not-found-icon { font-size: 3rem; margin-bottom: 16px; }
.not-found-card h2 { margin-bottom: 8px; }
.not-found-card p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
  margin-bottom: 20px;
}

/* Lookup box */
.lookup-box {
  margin-top: 28px;
  text-align: center;
}
.lookup-box p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 12px;
}
.lookup-input-wrap {
  display: flex;
  gap: 8px;
}

html, body { overflow-x: hidden; }
* { min-width: 0; }

@media(max-width:540px) {
  .verify-wrap { margin: 24px auto; padding: 0 14px 60px; }
  .verify-hdr { padding: 22px 16px 20px; }
  .verify-photo, .verify-photo-fallback { width: 84px; height: 84px; font-size: 34px; }
  .verify-title { font-size: 1.15rem; }
  .verify-body { padding: 18px 16px; }
  .verify-row { font-size: 13px; padding: 9px 0; flex-direction: column; gap: 3px; }
  .verify-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  .verify-val { text-align: left; }
  .not-found-card { padding: 28px 18px; }
}
</style>
</head>
<body>

<div id="nav-wrap"></div>

<div class="verify-wrap">

  <!-- Loading state -->
  <div id="loadingState" class="verify-loading">
    <div class="spinner dark" style="margin: 0 auto 16px; width: 32px; height: 32px;"></div>
    <p style="color: var(--muted); font-size: 14px;">Verifying agent…</p>
  </div>

  <!-- Verified state -->
  <div id="verifiedState" style="display:none;"></div>

  <!-- Not found state -->
  <div id="notFoundState" style="display:none;">
    <div class="not-found-card">
      <div class="not-found-icon">⚠️</div>
      <h2>Agent Not Found</h2>
      <p>We could not find a verified PhoneYa2 agent matching this ID. The agent may be inactive, or the link may be incorrect.</p>
      <p style="margin-bottom: 20px;">If you believe this is an error, contact PhoneYa2 directly:</p>
      <a href="https://wa.me/260979603741?text=Hi%20PhoneYa2!%20I%20am%20trying%20to%20verify%20an%20agent%20and%20could%20not%20find%20them."
         target="_blank" rel="noopener" class="btn btn-green btn-full">
        <i class="fab fa-whatsapp"></i> Contact PhoneYa2
      </a>
    </div>

    <!-- Manual lookup -->
    <div class="lookup-box">
      <p>Or look up a different agent:</p>
      <div class="lookup-input-wrap">
        <input type="text" class="input" id="lookupInput"
               placeholder="Agent ID (PYA-0001) or Code (PY001)"
               oninput="this.value=this.value.toUpperCase()"
               onkeydown="if(event.key==='Enter') doLookup()"
               style="flex:1;">
        <button class="btn btn-primary btn-sm" onclick="doLookup()"><i class="fas fa-search"></i></button>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="config.js"></script>
<script>
document.getElementById('nav-wrap').innerHTML = buildNav('public');

// ── VERIFY ───────────────────────────────────────────────────────────────
async function verify(identifier) {
  if (!identifier) return showNotFound();

  document.getElementById('loadingState').style.display  = 'block';
  document.getElementById('verifiedState').style.display = 'none';
  document.getElementById('notFoundState').style.display = 'none';

  try {
    // Try by agent_id first, then agent_code
    let agent = await db.getOne('agents', `agent_id=eq.${encodeURIComponent(identifier)}&active=eq.true`);
    if (!agent) {
      agent = await db.getOne('agents', `agent_code=eq.${encodeURIComponent(identifier)}&active=eq.true`);
    }
    if (!agent) throw new Error('Not found');

    await loadLevels();

    // Get confirmed sales for level calc
    const sales = await db.getAll('sales', { filter: `agent_code=eq.${agent.agent_code}` });
    const confirmed = sales.filter(s => s.status === 'confirmed' || s.status === 'paid');
    const totalSales = confirmed.length;
    const totalRevenue = confirmed.reduce((t,s) => t + (s.amount || 0), 0);
    const level = calcAgentLevel(totalSales, totalRevenue);

    // Photo HTML — photo or fallback initials
    const photoHtml = agent.profile_photo_url
      ? `<img src="${esc(agent.profile_photo_url)}" alt="${esc(agent.full_name)}" class="verify-photo"
              onerror="this.style.display='none';this.nextElementSibling && (this.nextElementSibling.style.display='flex');">
         <div class="verify-photo-fallback" style="display:none;">${(agent.full_name || '?')[0].toUpperCase()}</div>`
      : `<div class="verify-photo-fallback">${(agent.full_name || '?')[0].toUpperCase()}</div>`;

    document.getElementById('verifiedState').innerHTML = `
      <div class="verify-card">
        <div class="verify-hdr">
          <div class="verify-hdr-inner">
            ${photoHtml}
            <div class="verify-badge">
              <i class="fas fa-circle-check"></i>
              <span>VERIFIED AGENT</span>
            </div>
            <div class="verify-title">${esc(agent.full_name)}</div>
            <div class="verify-subtitle">${esc(agent.agent_id)} · ${esc(agent.agent_code)}</div>
          </div>
        </div>
        <div class="verify-body">
          <div class="verify-row">
            <span class="verify-lbl">Agent ID</span>
            <span class="verify-val" style="font-family:monospace;color:var(--orange);">${esc(agent.agent_id)}</span>
          </div>
          <div class="verify-row">
            <span class="verify-lbl">Agent Code</span>
            <span class="verify-val" style="font-family:monospace;color:var(--orange);">${esc(agent.agent_code)}</span>
          </div>
          <div class="verify-row">
            <span class="verify-lbl">Location</span>
            <span class="verify-val">${esc(agent.location || '—')}</span>
          </div>
          <div class="verify-row">
            <span class="verify-lbl">Level</span>
            <span class="verify-val" style="color:#7c3aed;">${level.current ? esc(level.current.name) : '—'}</span>
          </div>
          <div class="verify-row">
            <span class="verify-lbl">Sales</span>
            <span class="verify-val">${totalSales}</span>
          </div>
          <div class="verify-row">
            <span class="verify-lbl">Agent Since</span>
            <span class="verify-val">${fmtDate(agent.joined_at)}</span>
          </div>
          <div class="verify-row">
            <span class="verify-lbl">Status</span>
            <span class="verify-val"><span class="badge badge-green"><i class="fas fa-circle-check"></i> Active</span></span>
          </div>

          <div class="verify-note">
            <div class="verify-note-title">This person is authorised to sell on behalf of PhoneYa2-ZM</div>
            <p>Verified agents promote PhoneYa2 products and earn commission on confirmed sales. Orders are fulfilled directly by PhoneYa2-ZM. If you have a concern about this agent, contact us on WhatsApp.</p>
            <a href="https://wa.me/260979603741?text=Hi%20PhoneYa2!%20I%20have%20a%20question%20about%20agent%20${encodeURIComponent(agent.agent_id)}."
               target="_blank" rel="noopener" class="btn btn-green btn-sm">
              <i class="fab fa-whatsapp"></i> Contact PhoneYa2
            </a>
          </div>
        </div>
      </div>

      <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">
        <a href="profile.html?id=${esc(agent.agent_id)}" class="btn btn-primary btn-full">
          <i class="fas fa-user"></i> View Full Profile
        </a>
      </div>
    `;

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('verifiedState').style.display = 'block';
  } catch(e) {
    showNotFound();
  }
}

function showNotFound() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('verifiedState').style.display = 'none';
  document.getElementById('notFoundState').style.display = 'block';
}

function doLookup() {
  const q = document.getElementById('lookupInput').value.trim();
  if (!q) return;
  window.location.href = `verify.html?id=${encodeURIComponent(q)}`;
}

// ── BOOT ─────────────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const id     = params.get('id') || params.get('code') || '';

if (id) {
  verify(id.toUpperCase());
} else {
  showNotFound();
}
</script>
</body>
</html>
