<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Agent Network Control | PhoneYa2</title><style>body{margin:0;background:#f4f6fa;color:#172033;font:14px system-ui}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:white;border:1px solid #e5eaf1;border-radius:14px;padding:16px;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,button{border:0;border-radius:8px;padding:10px 13px;background:#102b4e;color:white;font-weight:800;cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;padding:10px;border-bottom:1px solid #e8edf3;align-items:center;flex-wrap:wrap}.muted{color:#667085}input{padding:8px;border:1px solid #ccd4df;border-radius:8px;max-width:140px}.good{color:#15803d;font-weight:800}</style></head><body><main class="wrap"><h1>Agent Network Control</h1><p class="muted">Admin-only controls using the existing Command Centre session.</p><div class="tabs"><button data-view="overview">Overview</button><button data-view="agents">Applications & agents</button><button data-view="sales">Sales & customers</button><button data-view="payouts">Weekly payouts</button><button data-view="recruitment">Recruitment rewards</button><button data-view="inventory">Agent inventory</button><button data-view="products">Product costs & commissions</button></div><div id="content" class="card">Loading…</div></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let view="overview",snapshot=null;
async function get(){const r=await fetch("/api/agent-network-admin?view="+view,{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"Administrator access required.");snapshot=d;render(d);}
async function post(b){const r=await fetch("/api/agent-network-admin",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(b)}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Action failed.");await get();}
function render(d){const host=$("#content");if(view==="overview"){const counts=Object.fromEntries((d.agents||[]).map(x=>[x.status,Number(x.n||0)]));host.innerHTML='<h2>Agent Network overview</h2><div class="row"><span>Pending applications</span><b>'+Number(counts.pending||0)+'</b></div><div class="row"><span>Active agents</span><b>'+Number(counts.active||0)+'</b></div><div class="row"><span>Suspended agents</span><b>'+Number(counts.suspended||0)+'</b></div><div class="row"><span>Assisted sale records awaiting review or linking</span><b>'+Number(d.assisted_sales||0)+'</b></div><div class="row"><span>Prospects recorded</span><b>'+Number(d.leads||0)+'</b></div><div class="row"><span>Withdrawal requests awaiting review</span><b>'+Number(d.payout_requests||0)+'</b></div><h3>Commission liabilities by status (ZMW)</h3>'+(d.commissions||[]).map(x=>'<div class="row"><span>'+esc(x.status)+'</span><b>K'+(Number(x.total||0)/100).toFixed(2)+'</b></div>').join("");return;}
if(view==="agents"){host.innerHTML='<h2>Agent applications and accounts</h2>'+(d.agents||[]).map(a=>'<div class="row"><span><b>'+esc(a.display_name||a.agent_id)+'</b><br><small>'+esc(a.email)+' · '+esc(a.agent_id)+' · '+a.sales+' attributed orders</small></span><span><b>'+esc(a.status)+'</b> '+(a.status==="pending"?'<button data-agent="'+esc(a.agent_id)+'" data-status="active">Approve</button> <button data-agent="'+esc(a.agent_id)+'" data-status="rejected">Reject</button>':'')+(a.status==="active"?'<button data-agent="'+esc(a.agent_id)+'" data-status="suspended">Suspend</button>':'')+'</span></div>').join("")||"No agent applications yet.";return;}
if(view==="sales"){host.innerHTML='<h2>Online orders attributed to agents</h2><p class="muted">Commission reconciliation is available only after an order is marked delivered. Product costs must be configured first.</p>'+(d.orders||[]).map(o=>'<div class="row"><span><b>'+esc(o.order_number)+'</b> · '+esc(o.customer_name)+'<br><small>'+esc(o.agent_code)+' · '+esc(o.customer_phone)+' · '+esc(o.customer_email||"")+' · '+esc(o.delivery_address||"")+' · '+esc(o.status)+' · fulfilment: '+esc(o.fulfilment_source||'phoneya2')+(o.fulfilment_agent_id?' / '+esc(o.fulfilment_agent_id):'')+' · step: '+esc(o.fulfilment_status||'central')+'</small></span><span>'+(o.fulfilment_status==="delivery_reported"&&o.status!=="delivered"?'<button data-confirm-delivery="'+esc(o.id)+'">Confirm delivery</button>':o.status==="delivered"?'<button data-order="'+esc(o.id)+'">Calculate commission</button>':'Await delivery')+'</span></div>').join("")+'<h2>Commission ledger</h2>'+(d.commissions||[]).map(c=>'<div class="row"><span>'+esc(c.order_number)+' · '+esc(c.agent_id)+'<br><small>K'+(c.commission_minor/100).toFixed(2)+' · '+esc(c.status)+'</small></span>'+(c.status==="pending_review"?'<button data-commission="'+esc(c.id)+'">Approve commission</button>':'')+'</div>').join("")+'<h2>Assisted sales submissions</h2>'+(d.sales||[]).map(s=>'<div class="row"><span>'+esc(s.customer_name)+' · '+esc(s.product_code)+' · '+esc(s.agent_id)+'<br><small>'+esc(s.customer_phone)+' · '+esc(s.customer_location||"")+' · '+esc(s.status)+' · '+esc(s.notes||"")+'</small></span><span>'+(s.status==="submitted"?'<button data-sale="'+esc(s.id)+'" data-status="verified">Verify</button><button data-sale="'+esc(s.id)+'" data-status="rejected">Reject</button>':'')+'</span></div>').join("");return;}
if(view==="payouts"){host.innerHTML='<h2>Withdrawal requests · weekly processing</h2>'+(d.payouts||[]).map(p=>'<div class="row"><span><b>'+esc(p.display_name||p.agent_id)+'</b> · '+esc(p.payment_provider||"mobile money")+' · '+esc(p.payment_phone)+'<br><small>K'+(p.amount_minor/100).toFixed(2)+' · '+esc(p.status)+'</small></span><span>'+(p.status==="requested"?'<button data-payout="'+esc(p.id)+'" data-status="approved">Approve</button>':'')+(p.status==="approved"?'<input data-reference="'+esc(p.id)+'" placeholder="Payment reference"><button data-payout="'+esc(p.id)+'" data-status="paid">Mark paid</button>':'')+'</span></div>').join("")||"No withdrawal requests.";return;}
if(view==="inventory"){host.innerHTML='<h2>Agent stock allocations</h2><p class="muted">Record PhoneYa2 stock held by agents and independently owned stock declared by approved agents. For PhoneYa2-owned stock, reduce central catalogue stock by the allocated quantity to prevent double-counting. Agent-owned stock is additional inventory. Reconcile every allocation before fulfilment.</p><div class="row"><select id="invAgent"><option value="">Choose agent</option>'+(d.agents||[]).map(x=>'<option value="'+esc(x.agent_id)+'">'+esc(x.agent_id)+'</option>').join("")+'</select><select id="invProduct"><option value="">Choose product</option>'+(d.products||[]).map(x=>'<option value="'+esc(x.product_slug)+'">'+esc(x.product_name)+' · '+esc(x.product_code)+'</option>').join("")+'</select><input id="invQty" type="number" min="0" max="10000" placeholder="Quantity"><select id="invOwnership"><option value="phoneya2">PhoneYa2-owned · agent custody</option><option value="agent">Agent-owned stock</option></select><button id="saveInventory">Save allocation</button></div>'+(d.inventory||[]).map(x=>'<div class="row"><span>'+esc(x.display_name||x.agent_id)+' · '+esc(x.product_name||x.product_slug)+'<br><small>'+esc(x.ownership)+' stock</small></span><b>'+x.quantity+' units</b></div>').join("")||"No stock allocations yet.";return;}
if(view==="recruitment"){host.innerHTML='<h2>Agent recruitment milestones</h2>'+(d.recruitments||[]).map(x=>'<div class="row"><span><b>'+esc(x.referrer_name||x.referrer_id)+'</b> invited '+esc(x.recruited_name||x.recruited_id)+'<br><small>'+esc(x.status)+' · '+x.milestone_sales+' verified sales required · reward K'+(x.reward_minor/100).toFixed(2)+'</small></span>'+(x.status==="earned"?'<button data-reward="'+esc(x.id)+'">Mark reward paid</button>':'')+'</div>').join("")||"No agent referrals yet.";return;}
if(view==="products"){host.innerHTML='<h2>Product costs and commission protection</h2><p class="muted">Set the real unit cost for each product. Progressive rates are capped at the configured percentage of gross profit. Commission cannot be approved while cost is missing.</p>'+(d.products||[]).map(p=>'<div class="row"><span><b>'+esc(p.product_name)+'</b><br><small>'+esc(p.product_code)+' · '+esc(p.product_slug)+'</small></span><span><input data-cost="'+esc(p.product_slug)+'" type="number" min="0" step=".01" placeholder="Unit cost K" value="'+(p.cost_minor==null?"":p.cost_minor/100)+'"><input data-cap="'+esc(p.product_slug)+'" type="number" min="0" max="100" step="1" placeholder="Profit cap %" value="'+esc(p.commission_profit_cap_pct??30)+'"><button data-save-cost="'+esc(p.product_slug)+'">Save</button></span></div>').join("")+'<div class="card"><h3>Progressive commission rules</h3><p class="muted">Each band is cumulative and rates apply only to the portion inside that band. Amounts are ngwee.</p><textarea id="commissionBands" rows="7" style="width:100%;font:12px monospace">'+esc(d.settings?.bands_json||"[]")+'</textarea><div class="row"><label>Maximum commission as % of gross profit <input id="profitCap" type="number" min="0" max="100" value="'+esc(d.settings?.profit_cap_pct||30)+'"></label><button id="saveCommissionRules">Save commission rules</button></div></div>';}}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button[data-view]");if(b){view=b.dataset.view;get().catch(x=>$("#content").textContent=x.message);}};
$("#content").onclick=async e=>{const b=e.target.closest("button");if(!b)return;try{if(b.dataset.agent)await post({action:"agent.review",agent_id:b.dataset.agent,status:b.dataset.status});if(b.id==="saveInventory")await post({action:"inventory.set",agent_id:$("#invAgent").value,product_slug:$("#invProduct").value,quantity:Number($("#invQty").value),ownership:$("#invOwnership").value});if(b.dataset.reward)await post({action:"recruitment.paid",id:b.dataset.reward});if(b.dataset.order){await post({action:"commission.reconcile",order_id:b.dataset.order});}if(b.dataset.confirmDelivery)await post({action:"fulfilment.confirm",order_id:b.dataset.confirmDelivery});if(b.dataset.sale)await post({action:"sale.review",id:b.dataset.sale,status:b.dataset.status});if(b.dataset.commission)await post({action:"commission.approve",id:b.dataset.commission});if(b.dataset.payout){const ref=$("[data-reference='"+b.dataset.payout+"']")?.value||"";await post({action:"payout.review",id:b.dataset.payout,status:b.dataset.status,reference:ref});}if(b.dataset.saveCost){const input=$("[data-cost='"+b.dataset.saveCost+"']");await post({action:"product.cost",product_slug:b.dataset.saveCost,cost_minor:Math.round(Number(input.value)*100),cap_pct:Number($("[data-cap='"+b.dataset.saveCost+"']").value||30)});}if(b.id==="saveCommissionRules"){const bands=JSON.parse($("#commissionBands").value);await post({action:"settings.save",bands,profit_cap_pct:Number($("#profitCap").value)});}}catch(x){alert(x.message);}};
get().catch(e=>$("#content").textContent=e.message);
</script></body></html>
