<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Agent Network Control | PhoneYa2</title><style>
:root{--blue:#1877f2;--navy:#102b4e;--ink:#172033;--muted:#687386;--line:#e6eaf0;--bg:#f3f6fb;--green:#15803d;--orange:#f97316}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,sans-serif}
.admin-top{background:linear-gradient(110deg,#102b4e,#1877f2);color:#fff;padding:18px max(18px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
.admin-brand{display:flex;flex-direction:column;gap:3px}.admin-brand b{font-size:19px}.admin-brand small{color:#dbeafe}.admin-top a{color:#fff;text-decoration:none;font-weight:800;background:#ffffff20;padding:10px 14px;border-radius:10px}
.wrap{max-width:1240px;margin:auto;padding:22px 18px 60px}.page-intro{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:4px 0 18px}.page-intro h1{margin:0;font-size:26px;letter-spacing:-.5px}.page-intro p{margin:5px 0 0;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #102b4e08}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:5px 0 12px;scrollbar-width:thin}.tabs button,button{border:0;border-radius:10px;padding:11px 14px;background:#edf2f8;color:#26364d;font-weight:800;cursor:pointer;white-space:nowrap}.tabs button.active,.tabs button:hover{background:var(--blue);color:#fff}
#content{min-height:280px;padding:22px}#content h2{margin:0 0 12px;font-size:20px}#content h3{margin:22px 0 10px}.row{display:flex;justify-content:space-between;gap:14px;padding:13px 10px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}.row:last-child{border-bottom:0}.row>span:first-child{min-width:220px;line-height:1.5}.row small{color:var(--muted)}.muted{color:var(--muted);line-height:1.55}
button:not(.tabs button){background:var(--blue);color:#fff}button:hover{filter:brightness(.96)}button[data-status="rejected"],button[data-status="suspended"]{background:#b42318}button[data-status="paid"],button[data-reward]{background:var(--green)}
input,select,textarea{font:inherit;padding:10px 11px;border:1px solid #d5dce7;border-radius:9px;background:#fff;color:var(--ink);max-width:100%}input:focus,select:focus,textarea:focus{outline:3px solid #1877f220;border-color:var(--blue)}
input[data-cost],input[data-cap]{width:130px}.good{color:var(--green);font-weight:800}
#content>.row:first-of-type{margin-top:10px}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:12px 0 22px}.metric{border:1px solid var(--line);border-radius:13px;padding:15px;background:#f9fbff}.metric small{color:var(--muted);font-weight:700}.metric b{display:block;font-size:24px;margin-top:8px;color:var(--navy)}
@media(max-width:650px){.admin-top{padding:14px 16px}.wrap{padding:16px 12px 42px}.page-intro{align-items:flex-start;flex-direction:column}.page-intro h1{font-size:22px}#content{padding:15px}.row{align-items:flex-start}.row>span:first-child{min-width:0;width:100%}.row>span:last-child{width:100%;display:flex;flex-wrap:wrap;gap:7px}input[data-cost],input[data-cap]{width:calc(50% - 6px)}}
</style></head><body><header class="admin-top"><div class="admin-brand"><b>PhoneYa2 · Agent Network</b><small>Management workspace · Restricted access</small></div><a href="/admin/command-center.html">← Command Centre</a></header><main class="wrap"><div class="page-intro"><div><h1>Agent management</h1><p>Monitor agents, review sales, manage stock and process commission payouts.</p></div></div><div class="tabs"><button data-view="overview" class="active">Overview</button><button data-view="agents">Applications & agents</button><button data-view="sales">Sales & customers</button><button data-view="payouts">Weekly payouts</button><button data-view="recruitment">Recruitment rewards</button><button data-view="inventory">Agent inventory</button><button data-view="products">Commission rules</button></div><div id="content" class="card">Loading…</div></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let view="overview",snapshot=null;
async function get(){const r=await fetch("/api/agent-network-admin?view="+view,{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"Administrator access required.");snapshot=d;render(d);}
async function post(b){const r=await fetch("/api/agent-network-admin",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(b)}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Action failed.");await get();}
function render(d){const host=$("#content");if(view==="overview"){const counts=Object.fromEntries((d.agents||[]).map(x=>[x.status,Number(x.n||0)]));host.innerHTML='<h2>Performance overview</h2><div class="metric-grid"><div class="metric"><small>Active agents</small><b>'+Number(counts.active||0)+'</b></div><div class="metric"><small>Pending applications</small><b>'+Number(counts.pending||0)+'</b></div><div class="metric"><small>Suspended agents</small><b>'+Number(counts.suspended||0)+'</b></div><div class="metric"><small>Delivered orders</small><b>'+Number(d.delivered_orders||0)+'</b></div><div class="metric"><small>Agent-attributed revenue</small><b>K'+(Number(d.revenue_minor||0)/100).toFixed(2)+'</b></div><div class="metric"><small>Assisted sales to review</small><b>'+Number(d.assisted_sales||0)+'</b></div><div class="metric"><small>Withdrawals to review</small><b>'+Number(d.payout_requests||0)+'</b></div></div><h3>Commission totals by status</h3>'+(d.commissions||[]).map(x=>'<div class="row"><span>'+esc(x.status)+'</span><b>K'+(Number(x.total||0)/100).toFixed(2)+'</b></div>').join("");return;}
if(view==="agents"){host.innerHTML='<h2>Agent applications and accounts</h2>'+(d.agents||[]).map(a=>'<div class="row"><span><b>'+esc(a.display_name||a.agent_id)+'</b><br><small>'+esc(a.email)+' · '+esc(a.agent_id)+' · '+a.sales+' attributed orders</small></span><span><b>'+esc(a.status)+'</b> '+(a.status==="pending"?'<button data-agent="'+esc(a.agent_id)+'" data-status="active">Approve</button> <button data-agent="'+esc(a.agent_id)+'" data-status="rejected">Reject</button>':'')+(a.status==="active"?'<button data-agent="'+esc(a.agent_id)+'" data-status="suspended">Suspend</button>':'')+'</span></div>').join("")||"No agent applications yet.";return;}
if(view==="sales"){host.innerHTML='<h2>Online orders attributed to agents</h2><p class="muted">Global price-band commission rules apply automatically. Commission is reviewed after an order is marked delivered.</p>'+(d.orders||[]).map(o=>'<div class="row"><span><b>'+esc(o.order_number)+'</b> · '+esc(o.customer_name)+'<br><small>'+esc(o.agent_code)+' · '+esc(o.customer_phone)+' · '+esc(o.customer_email||"")+' · '+esc(o.delivery_address||"")+' · '+esc(o.status)+' · fulfilment: '+esc(o.fulfilment_source||'phoneya2')+(o.fulfilment_agent_id?' / '+esc(o.fulfilment_agent_id):'')+' · step: '+esc(o.fulfilment_status||'central')+'</small></span><span>'+(o.fulfilment_status==="delivery_reported"&&o.status!=="delivered"?'<button data-confirm-delivery="'+esc(o.id)+'">Confirm delivery</button>':o.status==="delivered"?'<button data-order="'+esc(o.id)+'">Calculate commission</button>':'Await delivery')+'</span></div>').join("")+'<h2>Commission ledger</h2>'+(d.commissions||[]).map(c=>'<div class="row"><span>'+esc(c.order_number)+' · '+esc(c.agent_id)+'<br><small>K'+(c.commission_minor/100).toFixed(2)+' · '+esc(c.status)+'</small></span>'+(c.status==="pending_review"?'<button data-commission="'+esc(c.id)+'">Approve commission</button>':'')+'</div>').join("")+'<h2>Assisted sales submissions</h2>'+(d.sales||[]).map(s=>'<div class="row"><span>'+esc(s.customer_name)+' · '+esc(s.product_code)+' · '+esc(s.agent_id)+'<br><small>'+esc(s.customer_phone)+' · '+esc(s.customer_location||"")+' · '+esc(s.status)+' · '+esc(s.notes||"")+'</small></span><span>'+(s.status==="submitted"?'<button data-sale="'+esc(s.id)+'" data-status="verified">Verify</button><button data-sale="'+esc(s.id)+'" data-status="rejected">Reject</button>':'')+'</span></div>').join("");return;}
if(view==="payouts"){host.innerHTML='<h2>Withdrawal requests · weekly processing</h2>'+(d.payouts||[]).map(p=>'<div class="row"><span><b>'+esc(p.display_name||p.agent_id)+'</b> · '+esc(p.payment_provider||"mobile money")+' · '+esc(p.payment_phone)+'<br><small>K'+(p.amount_minor/100).toFixed(2)+' · '+esc(p.status)+'</small></span><span>'+(p.status==="requested"?'<button data-payout="'+esc(p.id)+'" data-status="approved">Approve</button>':'')+(p.status==="approved"?'<input data-reference="'+esc(p.id)+'" placeholder="Payment reference"><button data-payout="'+esc(p.id)+'" data-status="paid">Mark paid</button>':'')+'</span></div>').join("")||"No withdrawal requests.";return;}
if(view==="inventory"){host.innerHTML='<h2>Agent stock allocations</h2><p class="muted">Record PhoneYa2 stock held by agents and independently owned stock declared by approved agents. For PhoneYa2-owned stock, reduce central catalogue stock by the allocated quantity to prevent double-counting. Agent-owned stock is additional inventory. Reconcile every allocation before fulfilment.</p><div class="row"><select id="invAgent"><option value="">Choose agent</option>'+(d.agents||[]).map(x=>'<option value="'+esc(x.agent_id)+'">'+esc(x.agent_id)+'</option>').join("")+'</select><select id="invProduct"><option value="">Choose product</option>'+(d.products||[]).map(x=>'<option value="'+esc(x.product_slug)+'">'+esc(x.product_name)+' · '+esc(x.product_code)+'</option>').join("")+'</select><input id="invQty" type="number" min="0" max="10000" placeholder="Quantity"><select id="invOwnership"><option value="phoneya2">PhoneYa2-owned · agent custody</option><option value="agent">Agent-owned stock</option></select><button id="saveInventory">Save allocation</button></div>'+(d.inventory||[]).map(x=>'<div class="row"><span>'+esc(x.display_name||x.agent_id)+' · '+esc(x.product_name||x.product_slug)+'<br><small>'+esc(x.ownership)+' stock</small></span><b>'+x.quantity+' units</b></div>').join("")||"No stock allocations yet.";return;}
if(view==="recruitment"){host.innerHTML='<h2>Agent recruitment milestones</h2>'+(d.recruitments||[]).map(x=>'<div class="row"><span><b>'+esc(x.referrer_name||x.referrer_id)+'</b> invited '+esc(x.recruited_name||x.recruited_id)+'<br><small>'+esc(x.status)+' · '+x.milestone_sales+' verified sales required · reward K'+(x.reward_minor/100).toFixed(2)+'</small></span>'+(x.status==="earned"?'<button data-reward="'+esc(x.id)+'">Mark reward paid</button>':'')+'</div>').join("")||"No agent referrals yet.";return;}
if(view==="products"){const bands=(()=>{try{return JSON.parse(d.settings?.bands_json||"[]");}catch{return[];}})();const products=d.products||[];const rows=bands.length?bands:[{up_to_minor:null,rate:""}];host.innerHTML='<h2>Automatic commission rules</h2><p class="muted">Set commission by selling price. Every product uses these rules automatically — no product-by-product commission setup and no unit-cost entry. Each percentage applies to the full selling price in that band.</p><div id="commissionRules">'+rows.map(x=>'<div class="row commission-band-row" style="justify-content:flex-start;gap:12px"><label>Price below (K) <input data-band-limit type="number" min="0.01" step="0.01" placeholder="Blank = no upper limit" value="'+(x.up_to_minor==null?"":Number(x.up_to_minor)/100)+'"></label><label>Commission % <input data-band-rate type="number" min="0" max="100" step="0.1" placeholder="e.g. 5" value="'+esc(x.rate??"")+'"></label><button type="button" data-remove-band>Remove</button></div>').join("")+'</div><div class="row" style="justify-content:flex-start"><button id="addCommissionBand" type="button">＋ Add price band</button><button id="saveCommissionRules" type="button">Save commission rules</button></div><p class="muted">Leave the final band’s “Price below” blank to cover every higher-priced product. Example: below K100 = 5%, below K500 = 8%, K500 and above = 10%.</p><h3>Catalogue coverage</h3><p class="muted">'+products.length+' products automatically covered by these rules. No individual product settings required.</p>';}}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button[data-view]");if(b){view=b.dataset.view;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));get().catch(x=>$("#content").textContent=x.message);}};
$("#content").onclick=async e=>{const b=e.target.closest("button");if(!b)return;try{if(b.dataset.agent)await post({action:"agent.review",agent_id:b.dataset.agent,status:b.dataset.status});if(b.id==="saveInventory")await post({action:"inventory.set",agent_id:$("#invAgent").value,product_slug:$("#invProduct").value,quantity:Number($("#invQty").value),ownership:$("#invOwnership").value});if(b.dataset.reward)await post({action:"recruitment.paid",id:b.dataset.reward});if(b.dataset.order){await post({action:"commission.reconcile",order_id:b.dataset.order});}if(b.dataset.confirmDelivery)await post({action:"fulfilment.confirm",order_id:b.dataset.confirmDelivery});if(b.dataset.sale)await post({action:"sale.review",id:b.dataset.sale,status:b.dataset.status});if(b.dataset.commission)await post({action:"commission.approve",id:b.dataset.commission});if(b.dataset.payout){const ref=$("[data-reference='"+b.dataset.payout+"']")?.value||"";await post({action:"payout.review",id:b.dataset.payout,status:b.dataset.status,reference:ref});}if(b.dataset.saveCost){const input=$("[data-cost='"+b.dataset.saveCost+"']");await post({action:"product.cost",product_slug:b.dataset.saveCost,cost_minor:Math.round(Number(input.value)*100),cap_pct:Number($("[data-cap='"+b.dataset.saveCost+"']").value||30)});}if(b.id==="addCommissionBand"){const host=$("#commissionRules");host.insertAdjacentHTML("beforeend",'<div class="row commission-band-row" style="justify-content:flex-start;gap:12px"><label>Price below (K) <input data-band-limit type="number" min="0.01" step="0.01" placeholder="Blank = no upper limit"></label><label>Commission % <input data-band-rate type="number" min="0" max="100" step="0.1" placeholder="e.g. 5"></label><button type="button" data-remove-band>Remove</button></div>');return;}if(b.hasAttribute("data-remove-band")){b.closest(".commission-band-row")?.remove();return;}if(b.id==="saveCommissionRules"){const bands=[...$("#commissionRules").querySelectorAll(".commission-band-row")].map(row=>{const raw=row.querySelector("[data-band-limit]").value.trim(),rate=row.querySelector("[data-band-rate]").value.trim();if(rate==="")throw new Error("Enter a commission percentage for every band.");return{up_to_minor:raw===""?null:Math.round(Number(raw)*100),rate:Number(rate)};});await post({action:"settings.save",bands});}}catch(x){alert(x.message);}};
get().catch(e=>$("#content").textContent=e.message);
</script></body></html>
