<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Agent Network Control | PhoneYa2</title><style>

</style></head><body><header class="admin-top"><div class="admin-brand"><b>PhoneYa2 · Agent Network</b><small>Management workspace · Restricted access</small></div><a href="/admin/command-center.html">← Command Centre</a></header><main class="wrap"><div class="tabs" role="tablist" aria-label="Agent management sections"><button data-view="overview" class="active" role="tab" aria-selected="true">Overview</button><button data-view="agents" role="tab" aria-selected="false">Applications & agents</button><button data-view="sales" role="tab" aria-selected="false">Sales & customers</button><button data-view="recruitment" role="tab" aria-selected="false">Recruitment rewards</button><button data-view="inventory" role="tab" aria-selected="false">Agent inventory</button><button data-view="products" role="tab" aria-selected="false">Commission rules</button></div><div class="page-intro"><div><h1>Agent management</h1><p>One workspace for applications, agent activity, sales verification, stock and earnings.</p></div><span class="workspace-live"><i></i> LIVE OPERATIONS</span></div><div id="content" class="card">Loading…</div></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let view="overview",snapshot=null;
async function get(){const r=await fetch("/api/agent-network-admin?view="+view,{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"Administrator access required.");snapshot=d;render(d);}
async function post(b){const r=await fetch("/api/agent-network-admin",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(b)}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"Action failed.");await get();if(b.action==="sale.review"&&b.status==="verified"){try{window.parent?.PY2_REFRESH_DATA?.();}catch(error){console.warn("Command Centre refresh after agent sale approval failed:",error);}}}
function render(d){const host=$("#content");if(view==="overview"){const counts=Object.fromEntries((d.agents||[]).map(x=>[x.status,Number(x.n||0)]));host.innerHTML='<h2>Performance overview</h2><div class="metric-grid"><div class="metric"><small>Active agents</small><b>'+Number(counts.active||0)+'</b></div><div class="metric"><small>Pending applications</small><b>'+Number(counts.pending||0)+'</b></div><div class="metric"><small>Suspended agents</small><b>'+Number(counts.suspended||0)+'</b></div><div class="metric"><small>Delivered orders</small><b>'+Number(d.delivered_orders||0)+'</b></div><div class="metric"><small>Agent-attributed revenue</small><b>K'+(Number(d.revenue_minor||0)/100).toFixed(2)+'</b></div><div class="metric"><small>Assisted sales to review</small><b>'+Number(d.assisted_sales||0)+'</b></div></div><h3>Commission totals by status</h3>'+(d.commissions||[]).map(x=>'<div class="row"><span>'+esc(x.status)+'</span><b>K'+(Number(x.total||0)/100).toFixed(2)+'</b></div>').join("");return;}
if(view==="agents"){const agents=d.agents||[];host.innerHTML='<div class="section-heading"><div><h2>Applications & agent accounts</h2><p class="muted">Review each person, confirm their identity details and manage account access.</p></div><span class="agent-count">'+agents.length+' total</span></div><div class="agent-account-grid">'+(agents.map(a=>'<article class="agent-account-card">'+(a.profile_image_url?'<img class="agent-account-avatar" src="'+esc(a.profile_image_url)+'" alt="" loading="lazy" onerror="this.hidden=true">':'<div class="agent-account-avatar agent-avatar-fallback" aria-hidden="true">'+esc(String(a.display_name||a.agent_id||'PY').trim().slice(0,2).toUpperCase())+'</div>')+'<div class="agent-account-main"><div class="agent-account-title"><strong>'+esc(a.display_name||'PhoneYa2 Agent')+'</strong><span class="agent-account-status '+esc(a.status)+'">'+esc(a.status)+'</span></div><small class="agent-account-id">Agent ID · '+esc(a.agent_id)+'</small><div class="agent-account-meta"><span>'+esc(a.email)+'</span><span>'+esc(a.phone||'Phone not added')+'</span><span>'+Number(a.sales||0)+' delivered orders</span></div><div class="agent-account-actions">'+(a.status==="pending"?'<button data-agent="'+esc(a.agent_id)+'" data-status="active">Approve application</button><button data-agent="'+esc(a.agent_id)+'" data-status="rejected">Reject</button>':'')+(a.status==="active"?'<button data-agent="'+esc(a.agent_id)+'" data-status="suspended">Suspend account</button>':'')+(a.status==="suspended"?'<button data-agent="'+esc(a.agent_id)+'" data-status="active">Reactivate account</button>':'')+'</div></div></article>').join("")||'<div class="agent-account-empty">No agent applications or accounts yet.</div>')+'</div>';return;}
if(view==="sales"){
host.innerHTML='<style>.agent-sale-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:17px;margin:14px 0;border:1px solid #e3eaf3;border-radius:15px;background:#fff;box-shadow:0 4px 16px #102b4e08}.agent-sale-main{min-width:0}.agent-identity{display:flex;align-items:center;gap:11px;padding-bottom:13px;border-bottom:1px solid #edf0f5;margin-bottom:13px}.agent-identity img{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#edf2f8;border:2px solid #e6edf7}.agent-identity strong{display:block;font-size:14px}.agent-identity small{display:block;color:#687386;font-size:11px;margin-top:3px;overflow-wrap:anywhere}.sale-product{display:flex;gap:13px;align-items:center}.sale-product img{width:94px;height:94px;object-fit:contain;border:1px solid #edf0f5;border-radius:12px;background:#f8fafc;flex:none}.sale-product strong{display:block;font-size:15px}.sale-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.sale-detail{padding:9px 10px;border-radius:9px;background:#f7f9fc;min-width:0}.sale-detail small{display:block;color:#687386;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.35px}.sale-detail b{display:block;font-size:12px;margin-top:3px;overflow-wrap:anywhere}.sale-review-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}.sale-review-actions button{white-space:normal}.sale-warning{margin-top:10px;padding:9px 11px;border-radius:9px;background:#fff5f2;color:#a63222;font-size:11px;font-weight:750}.sale-meta{font-size:11px;color:#687386;margin-top:9px;line-height:1.6}@media(max-width:700px){.agent-sale-card{grid-template-columns:1fr}.sale-review-actions{flex-direction:row;flex-wrap:wrap}.sale-review-actions button{flex:1}.sale-product img{width:78px;height:78px}}@media(max-width:420px){.sale-details{grid-template-columns:1fr 1fr}}</style><h2>Agent-submitted sales for approval</h2><p class="muted">Each submission includes the agent identity, product photo, customer details, sale value and estimated commission. Verify the customer and product before approving.</p>'+(d.sales||[]).map(s=>'<article class="agent-sale-card"><div class="agent-sale-main"><div class="agent-identity"><img src="'+esc(s.profile_image_url||'/assets/images/default-avatar.png')+'" alt="" onerror="this.onerror=null;this.src=\'/assets/images/default-avatar.png\'"><div><strong>'+esc(s.display_name||'Agent')+'</strong><small>Agent ID: '+esc(s.agent_id)+' · '+esc(s.email||'')+'</small></div></div><div class="sale-product"><img src="'+esc(s.product_image||'')+'" alt="'+esc(s.product_name||s.product_code)+'" onerror="this.style.visibility=\'hidden\'"><div><strong>'+esc(s.product_name||s.product_code)+'</strong><small class="muted">Product code: '+esc(s.product_code)+'</small><div class="sale-meta">Submitted: '+esc(s.created_at)+'</div></div></div><div class="sale-details"><div class="sale-detail"><small>Customer</small><b>'+esc(s.customer_name)+'</b></div><div class="sale-detail"><small>Phone</small><b>'+esc(s.customer_phone)+'</b></div><div class="sale-detail"><small>Quantity</small><b>'+Number(s.quantity||0)+' unit(s)</b></div><div class="sale-detail"><small>Sale value</small><b>K'+(Number(s.estimated_sale_minor||0)/100).toFixed(2)+'</b></div><div class="sale-detail"><small>Expected commission</small><b>K'+(Number(s.estimated_commission_minor||0)/100).toFixed(2)+'</b></div><div class="sale-detail"><small>Customer location</small><b>'+esc(s.customer_location||'Not supplied')+'</b></div></div>'+(s.customer_email?'<div class="sale-meta">Customer email: '+esc(s.customer_email)+'</div>':'')+(s.notes?'<div class="sale-meta">Agent notes: '+esc(s.notes)+'</div>':'')+(Number(s.duplicate_count||0)>0?'<div class="sale-warning">Possible duplicate: '+Number(s.duplicate_count)+' matching recent agent sale(s) for this customer and product.</div>':'')+(Number(s.online_order_matches||0)>0?'<div class="sale-warning">Matching online order found: '+Number(s.online_order_matches)+'. Verify this is not the same purchase.</div>':'')+'</div><div class="sale-review-actions"><b>'+esc(s.status)+'</b>'+(s.status==="submitted"?'<button data-sale="'+esc(s.id)+'" data-status="verified">Approve & credit</button><button data-sale="'+esc(s.id)+'" data-status="rejected">Reject</button>':'')+'</div></article>').join("")||'<p class="muted">No agent sales submitted yet.</p>';
host.innerHTML+='<h2>Online orders attributed to agents</h2>'+(d.orders||[]).map(o=>'<div class="row"><span><b>'+esc(o.order_number)+'</b> · '+esc(o.customer_name)+'<br><small>'+esc(o.agent_code)+' · '+esc(o.customer_phone)+' · '+esc(o.customer_email||"")+' · '+esc(o.delivery_address||"")+' · '+esc(o.status)+' · fulfilment: '+esc(o.fulfilment_source||'phoneya2')+(o.fulfilment_agent_id?' / '+esc(o.fulfilment_agent_id):'')+' · step: '+esc(o.fulfilment_status||'central')+'</small></span><span>'+(o.fulfilment_status==="delivery_reported"&&o.status!=="delivered"?'<button data-confirm-delivery="'+esc(o.id)+'">Confirm delivery</button>':o.status==="delivered"?'<button data-order="'+esc(o.id)+'">Calculate commission</button>':'Await delivery')+'</span></div>').join("");
host.innerHTML+='<h2>Commission ledger</h2>'+(d.commissions||[]).map(c=>'<div class="row"><span>'+esc(c.order_number)+' · '+esc(c.agent_id)+'<br><small>K'+(c.commission_minor/100).toFixed(2)+' · '+esc(c.status)+'</small></span>'+(c.status==="pending_review"?'<button data-commission="'+esc(c.id)+'">Approve commission</button>':'')+'</div>').join("");
return;}
if(view==="inventory"){host.innerHTML='<h2>Central stock & agent custody</h2><p class="muted">PhoneYa2 owns the stock. Issue units to an agent when they collect stock, record every return, and approve a sale only after checking the customer transaction. Issued units reduce central stock; verified sales reduce the agent\'s custody; returns restore central stock. Agents never buy stock upfront.</p><div class="row"><select id="invAgent"><option value="">Choose agent</option>'+(d.agents||[]).map(x=>'<option value="'+esc(x.agent_id)+'">'+esc(x.agent_id)+'</option>').join("")+'</select><select id="invProduct"><option value="">Choose product</option>'+(d.products||[]).map(x=>'<option value="'+esc(x.product_slug)+'">'+esc(x.product_name)+' · central: '+Number(x.stock||0)+' · '+esc(x.product_code)+'</option>').join("")+'</select><input id="invQty" type="number" min="1" max="10000" placeholder="Quantity"><select id="invMovement"><option value="inventory.issue">Issue from central stock</option><option value="inventory.return">Record stock return</option></select><button id="saveInventory">Record stock movement</button></div><div class="row"><span><b>Receive stock / correct central count</b><br><small>Use this when new PhoneYa2 stock arrives or after a physical stocktake. Add a reason for the audit log.</small></span><select id="centralProduct"><option value="">Choose product</option>'+(d.products||[]).map(x=>'<option value="'+esc(x.product_slug)+'">'+esc(x.product_name)+'</option>').join("")+'</select><input id="centralStockQty" type="number" min="0" max="100000" placeholder="New central quantity"><input id="centralStockNote" type="text" maxlength="300" placeholder="Reason for adjustment"><button id="saveCentralStock">Update central stock</button></div><h3>Stock currently with agents</h3>'+((d.inventory||[]).filter(x=>x.ownership==="phoneya2"&&Number(x.quantity)>0).map(x=>'<div class="row"><span>'+esc(x.display_name||x.agent_id)+' · '+esc(x.product_name||x.product_slug)+'<br><small>PhoneYa2-owned stock · agent custody</small></span><b>'+Number(x.quantity)+' units</b></div>').join("")||'<p class="muted">No PhoneYa2 stock is currently issued to agents.</p>')+'<h3>Central stock available</h3>'+(d.products||[]).map(x=>'<div class="row"><span>'+esc(x.product_name)+'<br><small>'+esc(x.product_code)+' · '+esc(x.product_slug)+'</small></span><b>'+Number(x.stock||0)+' units</b></div>').join("")+'<h3>Recent stock movements</h3>'+((d.movements||[]).map(x=>'<div class="row"><span><b>'+esc(x.product_name||x.product_slug)+'</b> · '+esc(x.display_name||x.agent_id)+'<br><small>'+esc(x.movement_type)+' · '+esc(x.reference||'No reference')+' · '+esc(x.created_at||'')+'</small></span><b class="'+(Number(x.quantity_delta)<0?'':'good')+'">'+(Number(x.quantity_delta)>0?'+':'')+Number(x.quantity_delta)+' units</b></div>').join("")||'<p class="muted">No stock movements recorded yet.</p>');return;}
if(view==="recruitment"){host.innerHTML='<h2>Agent recruitment milestones</h2>'+(d.recruitments||[]).map(x=>'<div class="row"><span><b>'+esc(x.referrer_name||x.referrer_id)+'</b> invited '+esc(x.recruited_name||x.recruited_id)+'<br><small>'+esc(x.status)+' · '+x.milestone_sales+' verified sales required · reward K'+(x.reward_minor/100).toFixed(2)+'</small></span>'+(x.status==="earned"?'<button data-reward="'+esc(x.id)+'">Mark reward paid</button>':'')+'</div>').join("")||"No agent referrals yet.";return;}
if(view==="products"){const stored=(()=>{try{return JSON.parse(d.settings?.bands_json||"[]");}catch{return[];}})();let rows;if(stored.length&&stored[0].up_from_minor!=null){rows=stored.map(x=>({up_from_minor:Number(x.up_from_minor),rate:Number(x.rate)}));}else if(stored.length){let lower=0;rows=stored.map(x=>{const row={up_from_minor:lower,rate:Number(x.rate)};if(x.up_to_minor!=null)lower=Number(x.up_to_minor);return row;});}else{rows=[{up_from_minor:0,rate:10},{up_from_minor:10000,rate:6.6667},{up_from_minor:50000,rate:5}];}const products=d.products||[];host.innerHTML='<h2>Commission settings</h2><p class="muted">Very simple: enter the minimum selling price and the commission percentage. The percentage applies to the full sale amount. Higher prices should have lower percentages.</p><div id="commissionRules">'+rows.map((x,i)=>'<div class="row commission-band-row" style="justify-content:flex-start;gap:12px"><label>Price from (K) <input data-band-from type="number" min="0" step="0.01" value="'+(Number(x.up_from_minor||0)/100)+'"></label><label>Agent commission (%) <input data-band-rate type="number" min="0" max="100" step="0.01" value="'+esc(x.rate??"")+'"></label><button type="button" data-remove-band '+(i===0?'disabled title="The first price band must start at K0"':'')+'>Remove</button></div>').join("")+'</div><div class="row" style="justify-content:flex-start"><button id="addCommissionBand" type="button">＋ Add price level</button><button id="saveCommissionRules" type="button">Save changes</button><button id="applyRecommendedCommissionRules" type="button">Use recommended rates</button></div><p class="muted">Example: K0–K99.99 = 10%; K100–K499.99 = 6.67%; K500 and above = 5%. A K300 sale earns about K20.</p><h3>Catalogue coverage</h3><p class="muted">'+products.length+' products use these rules automatically.</p>';}}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button[data-view]");if(b){view=b.dataset.view;document.querySelectorAll(".tabs button").forEach(x=>{const active=x===b;x.classList.toggle("active",active);x.setAttribute("aria-selected",String(active));});get().catch(x=>$("#content").textContent=x.message);}};
$("#content").onclick=async e=>{const b=e.target.closest("button");if(!b)return;try{if(b.dataset.agent)await post({action:"agent.review",agent_id:b.dataset.agent,status:b.dataset.status});if(b.id==="saveInventory")await post({action:$("#invMovement").value,agent_id:$("#invAgent").value,product_slug:$("#invProduct").value,quantity:Number($("#invQty").value)});if(b.id==="saveCentralStock")await post({action:"inventory.central_adjust",product_slug:$("#centralProduct").value,quantity:Number($("#centralStockQty").value),note:$("#centralStockNote").value});if(b.dataset.reward)await post({action:"recruitment.paid",id:b.dataset.reward});if(b.dataset.order){await post({action:"commission.reconcile",order_id:b.dataset.order});}if(b.dataset.confirmDelivery)await post({action:"fulfilment.confirm",order_id:b.dataset.confirmDelivery});if(b.dataset.sale){const note=b.dataset.status==="rejected"?(prompt("Reason for rejecting this sale?")||""):"";if(b.dataset.status==="rejected"&&!note.trim())throw new Error("Add a reason before rejecting this sale.");await post({action:"sale.review",id:b.dataset.sale,status:b.dataset.status,note});}if(b.dataset.commission)await post({action:"commission.approve",id:b.dataset.commission});if(b.dataset.payout){const ref=$("[data-reference='"+b.dataset.payout+"']")?.value||"";await post({action:"payout.review",id:b.dataset.payout,status:b.dataset.status,reference:ref});}if(b.id==="addCommissionBand"){const host=$("#commissionRules");host.insertAdjacentHTML("beforeend",'<div class="row commission-band-row" style="justify-content:flex-start;gap:12px"><label>Price from (K) <input data-band-from type="number" min="0" step="0.01" placeholder="e.g. 1000"></label><label>Agent commission (%) <input data-band-rate type="number" min="0" max="100" step="0.01" placeholder="e.g. 4"></label><button type="button" data-remove-band>Remove</button></div>');return;}if(b.hasAttribute("data-remove-band")){b.closest(".commission-band-row")?.remove();return;}if(b.id==="applyRecommendedCommissionRules"){await post({action:"settings.save",bands:[{up_from_minor:0,rate:10},{up_from_minor:10000,rate:6.6667},{up_from_minor:50000,rate:5}]});return;}if(b.id==="saveCommissionRules"){const bands=[...$("#commissionRules").querySelectorAll(".commission-band-row")].map(row=>{const raw=row.querySelector("[data-band-from]").value.trim(),rate=row.querySelector("[data-band-rate]").value.trim();if(raw===""||rate==="")throw new Error("Fill in both fields for every price level.");return{up_from_minor:Math.round(Number(raw)*100),rate:Number(rate)};}).sort((a,b)=>a.up_from_minor-b.up_from_minor);if(!bands.length||bands[0].up_from_minor!==0)throw new Error("The first price level must start at K0.");for(let i=0;i<bands.length;i++){if(!Number.isSafeInteger(bands[i].up_from_minor)||bands[i].up_from_minor<0)throw new Error("Enter valid selling prices.");if(i&&bands[i].up_from_minor<=bands[i-1].up_from_minor)throw new Error("Each Price from amount must be higher than the previous one.");if(i&&bands[i].rate>bands[i-1].rate)throw new Error("Higher price levels must have the same or a lower commission percentage.");}await post({action:"settings.save",bands});}}catch(x){alert(x.message);}};
get().catch(e=>$("#content").textContent=e.message);
</script></body></html>
