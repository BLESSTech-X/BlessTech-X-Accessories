name: Rebuild Product Index

on:
  push:
    branches:
      - main
    paths:
      - 'content/products/**'

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild product index
        run: node build-product-index.js

      - name: Commit and push updated index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet content/products/index.json; then
            echo "index.json unchanged, nothing to commit"
            exit 0
          fi

          git add content/products/index.json
          git commit -m "chore: rebuild product index [skip ci]"
          git push
