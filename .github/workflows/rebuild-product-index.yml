name: Rebuild Product Index

on:
  push:
    branches:
      - main
    paths:
      - 'content/products/**'
      - 'build-product-index.js'
      - '.github/workflows/rebuild-product-index.yml'

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild product index
        run: node build-product-index.js

      - name: Commit and push generated product and blog indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add content/products/index.json content/products/catalog.json content/blog/index.json

          if git diff --cached --quiet; then
            echo "Generated product and blog indexes unchanged, nothing to commit"
            exit 0
          fi

          git commit -m "chore: publish generated product catalogue [skip ci]"
          git push
