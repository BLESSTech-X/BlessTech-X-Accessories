name: Rebuild Product Index and Sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'content/products/**'
      - 'content/blog/**'
      - 'build-product-index.js'
      - 'generate-sitemap.js'
      - '.github/workflows/rebuild-product-index.yml'

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild product and blog indexes
        run: node build-product-index.js

      - name: Generate sitemap
        run: node generate-sitemap.js

      - name: Commit and push generated indexes and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add content/products/index.json content/products/catalog.json content/blog/index.json sitemap.xml

          if git diff --cached --quiet; then
            echo "Generated indexes and sitemap unchanged, nothing to commit"
            exit 0
          fi

          git commit -m "chore: publish generated catalogue and sitemap [skip ci]"
          git push
